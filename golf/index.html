<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Putt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  :root {
    --bg: #0f1f16;
    --panel: #17301f;
    --panel-2: #1f3d28;
    --line: rgba(255, 255, 255, .09);
    --ink: #f4f7ee;
    --muted: #9db3a2;
    --accent: #f5c84c;
    --accent-shade: #b8912a;
    --accent-ink: #1d1a0a;
    --danger: #e5533d;
    --display: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
    height: 100%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 600 15px/1.4 var(--body);
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }

  .app {
    position: relative;
    height: 100%;
    width: 100%;
    overflow: hidden;
    max-width: 520px;
    margin: 0 auto;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
  }

  .hud {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    align-items: end;
    gap: 8px;
    padding-block: 10px 6px;
  }
  .stat { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
  .stat-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    font-family: var(--display);
    font-size: 32px;
    font-variant-numeric: tabular-nums;
    margin-top: 5px;
    letter-spacing: .01em;
  }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; align-self: center; }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
    font: 800 12px var(--body);
  }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

  .stage { flex: 1; min-height: 0; min-width: 0; position: relative; overflow: hidden; }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }

  .tip {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding-block: 8px 10px;
    min-height: 38px;
  }
  .tip strong { color: var(--ink); font-weight: 800; }

  .overlay {
    position: absolute; inset: 0;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(8, 18, 12, .6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    animation: pop .38s cubic-bezier(.2, .9, .3, 1.15);
  }
  .eyebrow {
    margin: 0;
    font-size: 11px; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  .card h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 44px;
    line-height: 1.05;
    margin: 8px 0 6px;
    text-wrap: balance;
  }
  .card h2.gold { color: var(--accent); }
  .card .sub { margin: 0 0 18px; color: var(--muted); }
  .card .best { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .card .best strong { color: var(--accent); }
  .btn {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--display);
    font-size: 21px;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-shade);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-shade); }

  .scorecard {
    width: 100%;
    border-collapse: collapse;
    margin: 4px 0 14px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    table-layout: fixed;
  }
  .scorecard th {
    text-align: left;
    color: var(--muted);
    font-weight: 800;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 2px;
    width: 42px;
  }
  .scorecard td { text-align: center; padding: 5px 0; }
  .scorecard tr + tr td, .scorecard tr + tr th { border-top: 1px solid var(--line); }
  .scorecard td:last-child, .scorecard th:last-child { border-left: 1px solid var(--line); font-weight: 800; }
  .mark {
    display: inline-grid; place-items: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-weight: 800;
  }
  .mark.birdie { box-shadow: 0 0 0 1.5px var(--ink); }
  .mark.eagle { box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 3px var(--panel), 0 0 0 4.5px var(--ink); }
  .mark.bogey { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink); }
  .mark.double { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 3px var(--panel), 0 0 0 4.5px var(--ink); }
  .legend { font-size: 11px; color: var(--muted); margin: 0 0 16px; }

  @keyframes pop {
    from { transform: scale(.86) translateY(14px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="stat">
      <span class="stat-label">Hole</span>
      <span class="stat-value" id="hudHole">1</span>
      <span class="stat-sub" id="hudPar">of 9 · Par 2</span>
    </div>
    <div class="stat">
      <span class="stat-label">Strokes</span>
      <span class="stat-value" id="hudStrokes">0</span>
      <span class="stat-sub" id="hudStrokesSub">this hole</span>
    </div>
    <div class="stat">
      <span class="stat-label">To par</span>
      <span class="stat-value" id="hudScore">E</span>
      <span class="stat-sub" id="hudScoreSub">0 holes done</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btnSound" type="button" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6"/><path class="wave" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6" hidden/></svg>
      </button>
      <button class="icon-btn" id="btnRestart" type="button" aria-label="Restart this hole">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="c" aria-label="Mini golf green. Drag back anywhere and release to putt."></canvas>
  </main>

  <footer class="tip" id="tip"><strong>Drag back</strong> anywhere on the green, then let go to putt</footer>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-live="polite">
      <p class="eyebrow" id="ovEyebrow">Hole 1 · Par 2</p>
      <h2 id="ovTitle">Par</h2>
      <p class="sub" id="ovSub">2 strokes</p>
      <div id="ovBody"></div>
      <button class="btn" id="ovBtn" type="button">Next hole</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const ctx = canvas.getContext('2d');
  const stage = $('stage');
  const tip = $('tip');
  const hud = {
    hole: $('hudHole'), par: $('hudPar'), strokes: $('hudStrokes'), strokesSub: $('hudStrokesSub'),
    score: $('hudScore'), scoreSub: $('hudScoreSub'),
  };
  const overlay = $('overlay');
  const ov = { eyebrow: $('ovEyebrow'), title: $('ovTitle'), sub: $('ovSub'), body: $('ovBody'), btn: $('ovBtn') };
  const btnSound = $('btnSound');
  const btnRestart = $('btnRestart');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- course ----------
  // Logical playfield: 360 x 600 units, portrait. Walls are [x, y, w, h].
  const W = 360, H = 600, T = 14;
  const BALL_R = 7, HOLE_R = 11;
  const MAX_DRAG = 150, MAX_SPEED = 13, MIN_SHOT = 10;
  const MAX_OVER_PAR = 5;

  const COURSE = [
    { name: 'Warm up', par: 2, ball: [180, 520], hole: [180, 90],
      hint: 'Drag back anywhere, then let go' },
    { name: 'The Wall', par: 2, ball: [180, 520], hole: [180, 90],
      walls: [[110, 290, 140, 22]], hint: 'Bank it off a side wall' },
    { name: 'Dogleg', par: 3, ball: [70, 520], hole: [290, 80],
      walls: [[14, 14, 210, 330]], hint: 'Go right first, then up' },
    { name: 'Bunkers', par: 3, ball: [180, 520], hole: [180, 90],
      sand: [[30, 260, 120, 70], [210, 260, 120, 70], [130, 40, 100, 100]], hint: 'Sand slows the ball right down' },
    { name: 'Switchback', par: 3, ball: [60, 530], hole: [300, 80],
      walls: [[14, 200, 230, 20], [116, 390, 230, 20]], hint: 'Thread the gaps or bounce through' },
    { name: 'The Pond', par: 3, ball: [180, 530], hole: [100, 80],
      water: [[14, 250, 120, 80], [226, 250, 120, 80]], hint: 'Water costs a stroke. Use the bridge' },
    { name: 'Pinball', par: 3, ball: [180, 530], hole: [180, 80],
      bumpers: [[120, 220, 22], [240, 220, 22], [180, 340, 26], [90, 420, 18], [270, 420, 18]], hint: 'Bumpers kick the ball back hard' },
    { name: 'Corridor', par: 3, ball: [47, 70], hole: [313, 70],
      walls: [[80, 14, 200, 400]], hint: 'Down, along the bottom, and back up' },
    { name: 'Last Green', par: 4, ball: [60, 540], hole: [300, 70],
      walls: [[14, 14, 190, 240]], water: [[204, 300, 100, 64]], sand: [[14, 290, 110, 90]], bumpers: [[150, 440, 22]],
      hint: 'Everything at once. Good luck' },
  ];
  const TOTAL_PAR = COURSE.reduce((s, h) => s + h.par, 0);

  const C = {
    bg: '#0f1f16', grassA: '#3fa34d', grassB: '#48b058', fringe: '#2e7f3e',
    bumper: '#f3e9cf', bumperSide: '#c9b98f', bumperLine: '#7d6b44',
    sand: '#e9d48c', sandDot: '#d3bc72', water: '#3f8fd9', waterLight: '#8cc6f4',
    hole: '#10140f', holeRim: '#24352a', flag: '#e5533d', pole: '#f6f1e6',
    ball: '#ffffff', ballShade: '#cfd3c6', accent: '#f5c84c', danger: '#e5533d', lime: '#b9f04a',
  };

  // ---------- view ----------
  let dpr = 1, scale = 1, ox = 0, oy = 0, cw = 1, ch = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    cw = Math.max(1, r.width); ch = Math.max(1, r.height);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    scale = Math.min(cw / W, ch / H);
    ox = (cw - W * scale) / 2;
    oy = (ch - H * scale) / 2;
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ---------- state ----------
  const game = { holeIndex: 0, strokes: 0, scores: [], state: 'idle', muted: false, shots: 0 };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 1, lastX: 0, lastY: 0 };
  let hole = COURSE[0];
  let walls = [], bumpers = [], sand = [], water = [], sandDots = [];
  let aim = null;
  let particles = [];
  let ripples = [];
  let sinkT = 0, splashT = 0, holeFlash = 0;
  let time = 0;
  let restartArmed = 0;
  let lastWallSound = 0;

  function loadHole(i) {
    game.holeIndex = i;
    hole = COURSE[i];
    walls = [[0, 0, W, T], [0, H - T, W, T], [0, 0, T, H], [W - T, 0, T, H], ...(hole.walls || [])];
    bumpers = (hole.bumpers || []).map(([x, y, r]) => ({ x, y, r, hit: -10 }));
    sand = hole.sand || [];
    water = hole.water || [];
    sandDots = [];
    let seed = 17 + i * 101;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (const [x, y, w, h] of sand) {
      const n = Math.round((w * h) / 140);
      for (let k = 0; k < n; k++) sandDots.push([x + 4 + rnd() * (w - 8), y + 4 + rnd() * (h - 8), 1 + rnd() * 1.4]);
    }
    ball.x = hole.ball[0]; ball.y = hole.ball[1];
    ball.vx = ball.vy = 0; ball.r = 1;
    ball.lastX = ball.x; ball.lastY = ball.y;
    game.strokes = 0;
    game.state = 'idle';
    aim = null; particles = []; ripples = [];
    updateHud();
    setTip(`<strong>${i + 1} · ${hole.name}</strong> · ${hole.hint}`);
  }

  // ---------- hud ----------
  function fmtPar(diff) {
    if (diff === 0) return 'E';
    return diff > 0 ? `+${diff}` : `−${-diff}`;
  }
  function completedDiff() {
    let d = 0;
    for (let i = 0; i < game.scores.length; i++) if (game.scores[i] != null) d += game.scores[i] - COURSE[i].par;
    return d;
  }
  function updateHud() {
    hud.hole.textContent = String(game.holeIndex + 1);
    hud.par.textContent = `of ${COURSE.length} · Par ${hole.par}`;
    hud.strokes.textContent = String(game.strokes);
    hud.strokesSub.textContent = game.strokes === 0 ? 'this hole' : (game.strokes <= hole.par ? `par is ${hole.par}` : `${game.strokes - hole.par} over`);
    hud.score.textContent = fmtPar(completedDiff());
    const done = game.scores.filter((s) => s != null).length;
    hud.scoreSub.textContent = `${done} hole${done === 1 ? '' : 's'} done`;
  }
  let tipTimer = 0;
  function setTip(html) { tip.innerHTML = html; }
  function toast(html, ms) {
    const prev = tip.innerHTML;
    tip.innerHTML = html;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => { tip.innerHTML = prev; }, ms);
  }

  // ---------- audio and haptics ----------
  let ac = null;
  function initAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, vol, freqEnd) {
    if (!ac || game.muted) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      const t0 = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is optional */ }
  }
  function noise(dur, vol, cutoff) {
    if (!ac || game.muted) return;
    try {
      const n = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, n, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
      const g = ac.createGain(); g.gain.value = vol;
      src.connect(f).connect(g).connect(ac.destination);
      src.start();
    } catch (e) { /* audio is optional */ }
  }
  const sfx = {
    putt(p) { noise(0.05, 0.35 * p + 0.05, 1500); tone(170, 0.09, 'triangle', 0.18 * p + 0.04, 80); },
    wall(p) { tone(420, 0.05, 'square', Math.min(0.09, 0.02 + 0.02 * p), 260); },
    bumper() { tone(660, 0.14, 'sine', 0.16, 990); },
    sink() { tone(784, 0.16, 'sine', 0.22); setTimeout(() => tone(1175, 0.4, 'sine', 0.22), 100); },
    water() { noise(0.4, 0.35, 500); tone(300, 0.3, 'sine', 0.1, 90); },
  };
  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* optional */ }
  }

  // ---------- input ----------
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale };
  }
  function aimVector() {
    const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy;
    const len = Math.hypot(dx, dy);
    const power = Math.min(len, MAX_DRAG);
    return { nx: len > 0 ? dx / len : 0, ny: len > 0 ? dy / len : -1, power };
  }
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    if (game.state !== 'idle') return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    const p = toLogical(e);
    aim = { id: e.pointerId, sx: p.x, sy: p.y, cx: p.x, cy: p.y };
    game.state = 'aiming';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!aim || e.pointerId !== aim.id) return;
    const p = toLogical(e);
    aim.cx = p.x; aim.cy = p.y;
  });
  function endAim(e, cancel) {
    if (!aim || e.pointerId !== aim.id) return;
    const v = aimVector();
    aim = null;
    if (cancel || v.power < MIN_SHOT) { game.state = 'idle'; return; }
    shoot(v.nx, v.ny, v.power);
  }
  canvas.addEventListener('pointerup', (e) => endAim(e, false));
  canvas.addEventListener('pointercancel', (e) => endAim(e, true));
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (aim) e.preventDefault(); }, { passive: false });

  function shoot(nx, ny, power) {
    const p = power / MAX_DRAG;
    const speed = 1.6 + p * (MAX_SPEED - 1.6);
    ball.vx = nx * speed; ball.vy = ny * speed;
    ball.lastX = ball.x; ball.lastY = ball.y;
    game.strokes++; game.shots++;
    game.state = 'rolling';
    updateHud();
    sfx.putt(p); buzz(10);
    if (game.shots === 1) setTip(`<strong>${game.holeIndex + 1} · ${hole.name}</strong> · ${hole.hint}`);
  }

  btnSound.addEventListener('click', () => {
    initAudio();
    game.muted = !game.muted;
    btnSound.setAttribute('aria-pressed', String(!game.muted));
    btnSound.setAttribute('aria-label', game.muted ? 'Sound off' : 'Sound on');
    btnSound.querySelectorAll('.wave').forEach((el) => { el.hidden = game.muted; });
    btnSound.querySelector('.mute').hidden = !game.muted;
    try { localStorage.setItem('pocketPutt.muted', game.muted ? '1' : '0'); } catch (e) { /* optional */ }
  });
  btnRestart.addEventListener('click', () => {
    if (game.state === 'holeDone' || game.state === 'courseDone') return;
    if (game.strokes === 0 && game.state === 'idle') return;
    if (!restartArmed) {
      restartArmed = setTimeout(() => { restartArmed = 0; btnRestart.classList.remove('armed'); btnRestart.textContent = ''; btnRestart.appendChild(restartIcon); }, 2200);
      btnRestart.classList.add('armed');
      btnRestart.textContent = 'Sure?';
      return;
    }
    clearTimeout(restartArmed); restartArmed = 0;
    btnRestart.classList.remove('armed');
    btnRestart.textContent = ''; btnRestart.appendChild(restartIcon);
    loadHole(game.holeIndex);
    toast('<strong>Hole restarted</strong>', 1500);
  });
  const restartIcon = btnRestart.querySelector('svg');

  // ---------- physics ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function inRects(rects, x, y) {
    for (const [rx, ry, rw, rh] of rects) if (x >= rx && x <= rx + rw && y >= ry && y <= ry + rh) return true;
    return false;
  }
  // Pushes body b out of any wall or bumper and reflects its velocity. Returns the last hit.
  function resolveCollisions(b, e) {
    let hit = null;
    for (const [x, y, w, h] of walls) {
      const cx = clamp(b.x, x, x + w), cy = clamp(b.y, y, y + h);
      const dx = b.x - cx, dy = b.y - cy;
      const d2 = dx * dx + dy * dy;
      if (d2 >= BALL_R * BALL_R) continue;
      let nx, ny, pen;
      if (d2 > 1e-6) {
        const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = BALL_R - d;
      } else {
        const l = b.x - x, r = x + w - b.x, tt = b.y - y, bb = y + h - b.y;
        const m = Math.min(l, r, tt, bb);
        if (m === l) { nx = -1; ny = 0; pen = l + BALL_R; }
        else if (m === r) { nx = 1; ny = 0; pen = r + BALL_R; }
        else if (m === tt) { nx = 0; ny = -1; pen = tt + BALL_R; }
        else { nx = 0; ny = 1; pen = bb + BALL_R; }
      }
      b.x += nx * pen; b.y += ny * pen;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
        hit = { type: 'wall', speed: -vn, x: b.x - nx * BALL_R, y: b.y - ny * BALL_R, nx, ny };
      }
    }
    for (const bp of bumpers) {
      const dx = b.x - bp.x, dy = b.y - bp.y;
      const d = Math.hypot(dx, dy), min = BALL_R + bp.r;
      if (d >= min || d === 0) continue;
      const nx = dx / d, ny = dy / d;
      b.x += nx * (min - d); b.y += ny * (min - d);
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        b.vx -= 2.15 * vn * nx; b.vy -= 2.15 * vn * ny;
        const s = Math.hypot(b.vx, b.vy);
        if (s < 5) { b.vx *= 5 / s; b.vy *= 5 / s; }
        hit = { type: 'bumper', bumper: bp, speed: -vn, x: b.x - nx * BALL_R, y: b.y - ny * BALL_R, nx, ny };
      }
    }
    return hit;
  }

  function spawnSparks(x, y, nx, ny, n, color) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const a = Math.atan2(ny, nx) + (Math.random() - 0.5) * 1.6;
      const s = 1 + Math.random() * 2.5;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.3, age: 0, color, size: 1.5 + Math.random() * 1.5 });
    }
  }

  function update(dt) {
    time += dt;
    for (const p of particles) { p.age += dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vx *= 0.92; p.vy *= 0.92; }
    particles = particles.filter((p) => p.age < p.life);
    for (const r of ripples) r.age += dt;
    ripples = ripples.filter((r) => r.age < r.life);

    if (game.state === 'sinking') {
      sinkT += dt;
      const k = Math.min(1, sinkT / 0.38);
      ball.x += (hole.hole[0] - ball.x) * Math.min(1, dt * 14);
      ball.y += (hole.hole[1] - ball.y) * Math.min(1, dt * 14);
      ball.r = 1 - k * k;
      if (k >= 1) finishHole(false);
      return;
    }
    if (game.state === 'splash') {
      splashT += dt;
      if (splashT >= 0.9) {
        ball.x = ball.lastX; ball.y = ball.lastY; ball.r = 1;
        ball.vx = ball.vy = 0;
        game.strokes++;
        updateHud();
        game.state = 'idle';
        checkPickup();
      }
      return;
    }
    if (game.state !== 'rolling') return;

    let remaining = dt;
    const sub = 1 / 240;
    while (remaining > 0) {
      const h = Math.min(sub, remaining); remaining -= h;
      const k = h * 60;
      const onSand = inRects(sand, ball.x, ball.y);
      const speed = Math.hypot(ball.vx, ball.vy);
      if (speed > 0) {
        const f = onSand ? 0.93 : 0.984;
        const lin = onSand ? 0.05 : 0.012;
        let ns = speed * Math.pow(f, k) - lin * k;
        if (ns < 0) ns = 0;
        ball.vx *= ns / speed; ball.vy *= ns / speed;
      }
      // the cup pulls a slow ball in
      const hx = hole.hole[0] - ball.x, hy = hole.hole[1] - ball.y;
      const hd = Math.hypot(hx, hy);
      const sp = Math.hypot(ball.vx, ball.vy);
      if (hd < HOLE_R * 1.9 && sp < 7) {
        ball.vx += (hx / hd) * 0.22 * k; ball.vy += (hy / hd) * 0.22 * k;
      }
      ball.x += ball.vx * k; ball.y += ball.vy * k;

      const hit = resolveCollisions(ball, 0.78);
      if (hit) {
        if (hit.type === 'bumper') {
          hit.bumper.hit = time;
          sfx.bumper(); buzz(15);
          spawnSparks(hit.x, hit.y, hit.nx, hit.ny, 8, C.accent);
        } else if (hit.speed > 1.2 && time - lastWallSound > 0.06) {
          lastWallSound = time;
          sfx.wall(Math.min(1, hit.speed / MAX_SPEED));
          spawnSparks(hit.x, hit.y, hit.nx, hit.ny, 4, C.bumper);
        }
      }

      if (hd < HOLE_R && Math.hypot(ball.vx, ball.vy) < 5.5) {
        game.state = 'sinking'; sinkT = 0; holeFlash = time;
        ball.vx = ball.vy = 0;
        sfx.sink(); buzz([20, 40, 60]);
        return;
      }
      if (inRects(water, ball.x, ball.y)) {
        game.state = 'splash'; splashT = 0;
        ball.vx = ball.vy = 0; ball.r = 0;
        ripples.push({ x: ball.x, y: ball.y, age: 0, life: 0.9 }, { x: ball.x, y: ball.y, age: -0.2, life: 1.1 });
        sfx.water(); buzz([10, 30, 10]);
        toast('<strong>Splash!</strong> One stroke penalty', 2200);
        return;
      }
      if (Math.hypot(ball.vx, ball.vy) < 0.05) {
        ball.vx = ball.vy = 0;
        game.state = 'idle';
        checkPickup();
        return;
      }
    }
  }

  function checkPickup() {
    if (game.strokes >= hole.par + MAX_OVER_PAR) finishHole(true);
  }

  // ---------- scoring ----------
  function scoreLabel(strokes, par) {
    const d = strokes - par;
    if (strokes === 1) return 'Hole in one!';
    if (d <= -3) return 'Albatross!';
    if (d === -2) return 'Eagle!';
    if (d === -1) return 'Birdie!';
    if (d === 0) return 'Par';
    if (d === 1) return 'Bogey';
    if (d === 2) return 'Double bogey';
    if (d === 3) return 'Triple bogey';
    return `${d} over`;
  }
  function markClass(strokes, par) {
    const d = strokes - par;
    if (d <= -2) return 'mark eagle';
    if (d === -1) return 'mark birdie';
    if (d === 1) return 'mark bogey';
    if (d >= 2) return 'mark double';
    return 'mark';
  }

  function showOverlay(o) {
    ov.eyebrow.textContent = o.eyebrow;
    ov.title.textContent = o.title;
    ov.title.classList.toggle('gold', !!o.gold);
    ov.sub.textContent = o.sub;
    ov.body.innerHTML = o.body || '';
    ov.btn.textContent = o.button;
    ov.btn.onclick = () => { initAudio(); overlay.hidden = true; o.onClick(); };
    overlay.hidden = false;
    ov.btn.focus({ preventScroll: true });
  }

  function finishHole(pickedUp) {
    game.scores[game.holeIndex] = game.strokes;
    game.state = 'holeDone';
    updateHud();
    const last = game.holeIndex === COURSE.length - 1;
    const d = game.strokes - hole.par;
    setTimeout(() => {
      showOverlay({
        eyebrow: `Hole ${game.holeIndex + 1} · ${hole.name} · Par ${hole.par}`,
        title: pickedUp ? 'Picked up' : scoreLabel(game.strokes, hole.par),
        gold: !pickedUp && d < 0,
        sub: pickedUp
          ? `Max ${game.strokes} strokes on this hole`
          : `${game.strokes} stroke${game.strokes === 1 ? '' : 's'}, ${d === 0 ? 'level par' : fmtPar(d) + ' on this hole'}`,
        button: last ? 'See the scorecard' : 'Next hole',
        onClick: () => { if (last) finishCourse(); else loadHole(game.holeIndex + 1); },
      });
    }, pickedUp ? 250 : 450);
  }

  function finishCourse() {
    game.state = 'courseDone';
    const total = game.scores.reduce((s, v) => s + v, 0);
    const d = total - TOTAL_PAR;
    let best = null;
    try {
      const prev = parseInt(localStorage.getItem('pocketPutt.best'), 10);
      best = Number.isFinite(prev) ? prev : null;
      if (best === null || total < best) { localStorage.setItem('pocketPutt.best', String(total)); }
    } catch (e) { /* storage is optional */ }
    const isNewBest = best === null || total < best;

    const cells = (fn) => COURSE.map((h, i) => `<td>${fn(h, i)}</td>`).join('');
    const body = `
      <table class="scorecard" aria-label="Scorecard">
        <tr><th>Hole</th>${cells((h, i) => i + 1)}<td>Tot</td></tr>
        <tr><th>Par</th>${cells((h) => h.par)}<td>${TOTAL_PAR}</td></tr>
        <tr><th>You</th>${cells((h, i) => `<span class="${markClass(game.scores[i], h.par)}">${game.scores[i]}</span>`)}<td>${total}</td></tr>
      </table>
      <p class="legend">Circle for birdie, double circle for eagle, square for bogey, double square for worse.</p>
      <p class="best">${isNewBest ? '<strong>New best round</strong>' : `Your best round is <strong>${best}</strong>`}${best !== null && !isNewBest ? '' : ''}</p>`;
    showOverlay({
      eyebrow: 'Course complete · 9 holes',
      title: d === 0 ? 'Level par' : (d < 0 ? `${-d} under par` : `${d} over par`),
      gold: d < 0,
      sub: `${total} strokes, par ${TOTAL_PAR}`,
      body,
      button: 'Play again',
      onClick: () => { game.scores = []; game.shots = 0; loadHole(0); },
    });
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function lerpColor(a, b, t) {
    const pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    const pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  function powerColor(p) {
    return p < 0.5 ? lerpColor(C.lime, C.accent, p * 2) : lerpColor(C.accent, C.danger, (p - 0.5) * 2);
  }

  function drawCourse() {
    // ground shadow under the course
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
    ctx.fillStyle = C.bumper;
    roundRect(0, 0, W, H, 18); ctx.fill();
    ctx.restore();

    ctx.save();
    roundRect(0, 0, W, H, 18); ctx.clip();

    // mown stripes
    for (let y = 0, i = 0; y < H; y += 40, i++) {
      ctx.fillStyle = i % 2 ? C.grassA : C.grassB;
      ctx.fillRect(0, y, W, 40);
    }
    // fringe just inside the boards
    ctx.strokeStyle = C.fringe; ctx.lineWidth = 3;
    ctx.strokeRect(T + 1.5, T + 1.5, W - 2 * T - 3, H - 2 * T - 3);

    // sand
    for (const [x, y, w, h] of sand) {
      ctx.fillStyle = C.sand; roundRect(x, y, w, h, 10); ctx.fill();
    }
    ctx.fillStyle = C.sandDot;
    for (const [x, y, r] of sandDots) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

    // water
    for (const [x, y, w, h] of water) {
      ctx.save();
      roundRect(x, y, w, h, 10); ctx.clip();
      ctx.fillStyle = C.water; ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = C.waterLight; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.55;
      const ph = reduceMotion ? 0 : time * 1.6;
      for (let row = 0; row < 3; row++) {
        const yy = y + h * (0.25 + row * 0.25);
        ctx.beginPath();
        for (let xx = x; xx <= x + w; xx += 4) {
          const wy = yy + Math.sin(xx * 0.09 + ph + row * 1.3) * 3;
          if (xx === x) ctx.moveTo(xx, wy); else ctx.lineTo(xx, wy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    for (const r of ripples) {
      if (r.age < 0) continue;
      const k = r.age / r.life;
      ctx.strokeStyle = C.waterLight; ctx.globalAlpha = (1 - k) * 0.9; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 4 + k * 26, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // cup
    const [hx, hy] = hole.hole;
    const glow = Math.max(0, 1 - (time - holeFlash) / 0.6);
    if (glow > 0) {
      ctx.fillStyle = C.accent; ctx.globalAlpha = glow * 0.5;
      ctx.beginPath(); ctx.arc(hx, hy, HOLE_R + 6 + (1 - glow) * 18, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = C.holeRim; ctx.beginPath(); ctx.arc(hx, hy, HOLE_R + 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.hole; ctx.beginPath(); ctx.arc(hx, hy, HOLE_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(hx, hy + 3, HOLE_R - 3, 0, Math.PI); ctx.fill();

    // boards
    for (const [x, y, w, h] of walls) {
      ctx.fillStyle = C.bumperSide; roundRect(x, y + 3, w, h, 4); ctx.fill();
      ctx.fillStyle = C.bumper; roundRect(x, y, w, h, 4); ctx.fill();
      ctx.strokeStyle = C.bumperLine; ctx.lineWidth = 1; ctx.globalAlpha = 0.35;
      roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 4); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // bumpers
    for (const bp of bumpers) {
      const k = Math.max(0, 1 - (time - bp.hit) / 0.3);
      const r = bp.r + k * 4;
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(bp.x + 2, bp.y + 4, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = k > 0 ? lerpColor(C.danger, C.accent, k) : C.danger;
      ctx.beginPath(); ctx.arc(bp.x, bp.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(bp.x, bp.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.danger; ctx.beginPath(); ctx.arc(bp.x, bp.y, r * 0.22, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // board frame
    ctx.strokeStyle = C.bumperLine; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.5;
    roundRect(0.75, 0.75, W - 1.5, H - 1.5, 18); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawFlag() {
    const [hx, hy] = hole.hole;
    const wave = reduceMotion ? 0 : Math.sin(time * 5) * 2;
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx + 1, hy + 1); ctx.lineTo(hx + 9, hy - 22); ctx.stroke();
    ctx.strokeStyle = C.pole; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy - 34); ctx.stroke();
    ctx.fillStyle = C.flag;
    ctx.beginPath();
    ctx.moveTo(hx + 1, hy - 34);
    ctx.lineTo(hx + 19 + wave, hy - 27);
    ctx.lineTo(hx + 1, hy - 20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.pole; ctx.beginPath(); ctx.arc(hx, hy - 35, 2, 0, Math.PI * 2); ctx.fill();
  }

  function drawBall() {
    if (ball.r <= 0) return;
    const r = BALL_R * ball.r;
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(ball.x + 2, ball.y + 3, r * 1.05, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(ball.x - r * 0.35, ball.y - r * 0.4, r * 0.2, ball.x, ball.y, r);
    g.addColorStop(0, C.ball); g.addColorStop(1, C.ballShade);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2); ctx.stroke();
  }

  function drawIdleRing() {
    const pulse = reduceMotion ? 0 : Math.sin(time * 3) * 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 4]);
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R + 6 + pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawAim() {
    const { nx, ny, power } = aimVector();
    const p = power / MAX_DRAG;
    const col = powerColor(p);

    // the drag itself, shown faintly so the "pull back" reads
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(aim.sx, aim.sy); ctx.lineTo(aim.cx, aim.cy); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(aim.sx, aim.sy, 5, 0, Math.PI * 2); ctx.fill();

    if (power < MIN_SHOT) { drawIdleRing(); return; }

    // predicted path, with bounces
    const g = { x: ball.x, y: ball.y, vx: nx * 7, vy: ny * 7 };
    const steps = Math.round(5 + p * 28);
    ctx.fillStyle = col;
    for (let i = 0; i < steps; i++) {
      g.x += g.vx; g.y += g.vy;
      resolveCollisions(g, 1);
      const fade = 1 - i / steps;
      ctx.globalAlpha = 0.25 + fade * 0.7;
      ctx.beginPath(); ctx.arc(g.x, g.y, 1.6 + fade * 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // arrow head on the first straight segment
    const ax = ball.x + nx * (BALL_R + 14), ay = ball.y + ny * (BALL_R + 14);
    ctx.save();
    ctx.translate(ax, ay); ctx.rotate(Math.atan2(ny, nx));
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-4, -6); ctx.lineTo(-1, 0); ctx.lineTo(-4, 6); ctx.closePath(); ctx.fill();
    ctx.restore();

    // power ring around the ball
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R + 7, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p); ctx.stroke();
    ctx.lineCap = 'butt';
  }

  function drawParticles() {
    for (const pt of particles) {
      ctx.globalAlpha = 1 - pt.age / pt.life;
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
    drawCourse();
    drawBall();
    if (game.state === 'idle') drawIdleRing();
    if (game.state === 'aiming' && aim) drawAim();
    drawFlag();
    drawParticles();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function start(saved) {
    try { game.muted = localStorage.getItem('pocketPutt.muted') === '1'; } catch (e) { /* optional */ }
    if (game.muted) {
      btnSound.setAttribute('aria-pressed', 'false');
      btnSound.setAttribute('aria-label', 'Sound off');
      btnSound.querySelectorAll('.wave').forEach((el) => { el.hidden = true; });
      btnSound.querySelector('.mute').hidden = false;
    }
    if (saved && Array.isArray(saved.scores) && Number.isInteger(saved.holeIndex) && saved.holeIndex < COURSE.length) {
      game.scores = saved.scores.slice(0, saved.holeIndex);
      game.shots = saved.shots || 0;
      loadHole(saved.holeIndex);
    } else {
      loadHole(0);
    }
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ holeIndex: game.holeIndex, scores: game.scores, shots: game.shots }));
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
})();
</script>
</body>
</html>
