<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  :root {
    --bg: #0f1f16;
    --panel: #17301f;
    --panel-2: #1f3d28;
    --line: rgba(255, 255, 255, .09);
    --ink: #f4f7ee;
    --muted: #9db3a2;
    --accent: #f5c84c;
    --accent-shade: #b8912a;
    --accent-ink: #1d1a0a;
    --danger: #e5533d;
    --display: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
    height: 100%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 600 15px/1.4 var(--body);
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }

  .app {
    position: relative;
    height: 100%;
    width: 100%;
    overflow: hidden;
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
  }

  .hud {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    align-items: end;
    gap: 8px;
    padding-block: 10px 8px;
  }
  .stat { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
  .stat-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    font-family: var(--display);
    font-size: 30px;
    font-variant-numeric: tabular-nums;
    margin-top: 5px;
    letter-spacing: .01em;
  }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; align-self: center; }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
    font: 800 12px var(--body);
  }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn:focus-visible, .btn:focus-visible, .club:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

  .stage {
    flex: 1; min-height: 0; min-width: 0;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: linear-gradient(180deg, #6fc3ff 0%, #a9dcff 55%, #e9f7ff 100%);
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  .pin {
    position: absolute; top: 10px; left: 10px;
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(10, 24, 16, .62);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
    line-height: 1;
  }
  .pin-dist { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
  .pin-dist small { font-family: var(--body); font-size: 12px; font-weight: 800; color: var(--muted); margin-left: 2px; }
  .pin-surface { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .pin-surface.green { color: #b9f04a; }
  .pin-surface.sand { color: #f0dc9a; }
  .pin-surface.rough { color: #f2b26b; }

  .power {
    position: absolute; left: 12px; bottom: 16px;
    width: 14px; height: 42%;
    border-radius: 8px;
    background: rgba(10, 24, 16, .55);
    border: 1px solid rgba(255, 255, 255, .18);
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .power.on { opacity: 1; }
  .power-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0%;
    background: var(--accent);
    border-radius: 8px;
  }
  .carry {
    position: absolute; left: 32px; bottom: 16px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(10, 24, 16, .62);
    font-family: var(--display);
    font-size: 18px;
    line-height: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .carry small { font-family: var(--body); font-size: 11px; font-weight: 800; color: var(--muted); }
  .carry.on { opacity: 1; }
  .skip {
    position: absolute; right: 10px; bottom: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(10, 24, 16, .62);
    color: var(--ink);
    font: 800 12px var(--body);
    letter-spacing: .06em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .stage-msg {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 24px;
    text-align: center;
    background: var(--bg);
    color: var(--ink);
  }
  .stage-msg p { max-width: 30ch; margin: 0; }

  .clubs {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding-block: 10px 0;
  }
  .club {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 16px;
    padding: 9px 8px 8px;
    cursor: pointer;
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px;
    line-height: 1;
    min-width: 0;
    min-height: 52px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .35);
  }
  .club:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .club svg { width: 26px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .club-text { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
  .club-name { font-family: var(--display); font-size: 18px; letter-spacing: .01em; }
  .club-desc { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .club[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-shade); }
  .club[aria-pressed="true"]:active { box-shadow: 0 2px 0 var(--accent-shade); }
  .club[aria-pressed="true"] .club-desc { color: rgba(29, 26, 10, .7); }
  .club:disabled { opacity: .45; cursor: default; }

  .tip {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding-block: 8px 10px;
    min-height: 38px;
  }
  .tip strong { color: var(--ink); font-weight: 800; }

  .overlay {
    position: absolute; inset: 0;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(8, 18, 12, .6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    animation: pop .38s cubic-bezier(.2, .9, .3, 1.15);
  }
  .eyebrow {
    margin: 0;
    font-size: 11px; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  .card h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 44px;
    line-height: 1.05;
    margin: 8px 0 6px;
    text-wrap: balance;
  }
  .card h2.gold { color: var(--accent); }
  .card .sub { margin: 0 0 18px; color: var(--muted); }
  .card .best { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .card .best strong { color: var(--accent); }
  .btn {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--display);
    font-size: 21px;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-shade);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-shade); }

  .scorecard {
    width: 100%;
    border-collapse: collapse;
    margin: 4px 0 14px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    table-layout: fixed;
  }
  .scorecard th {
    text-align: left;
    color: var(--muted);
    font-weight: 800;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 2px;
    width: 42px;
  }
  .scorecard td { text-align: center; padding: 5px 0; }
  .scorecard tr + tr td, .scorecard tr + tr th { border-top: 1px solid var(--line); }
  .scorecard td:last-child, .scorecard th:last-child { border-left: 1px solid var(--line); font-weight: 800; }
  .mark {
    display: inline-grid; place-items: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-weight: 800;
  }
  .mark.birdie { box-shadow: 0 0 0 1.5px var(--ink); }
  .mark.eagle { box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 3px var(--panel), 0 0 0 4.5px var(--ink); }
  .mark.bogey { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink); }
  .mark.double { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 3px var(--panel), 0 0 0 4.5px var(--ink); }
  .legend { font-size: 11px; color: var(--muted); margin: 0 0 16px; }

  @keyframes pop {
    from { transform: scale(.86) translateY(14px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn, .power, .carry { transition: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="stat">
      <span class="stat-label">Hole</span>
      <span class="stat-value" id="hudHole">1</span>
      <span class="stat-sub" id="hudPar">of 9 · Par 2</span>
    </div>
    <div class="stat">
      <span class="stat-label">Strokes</span>
      <span class="stat-value" id="hudStrokes">0</span>
      <span class="stat-sub" id="hudStrokesSub">this hole</span>
    </div>
    <div class="stat">
      <span class="stat-label">To par</span>
      <span class="stat-value" id="hudScore">E</span>
      <span class="stat-sub" id="hudScoreSub">0 holes done</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btnSound" type="button" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6"/><path class="wave" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6" hidden/></svg>
      </button>
      <button class="icon-btn" id="btnRestart" type="button" aria-label="Restart this hole">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="c" aria-label="Toy golf course. Drag back anywhere and release to hit the ball."></canvas>
    <div class="pin" aria-live="off">
      <span class="pin-dist" id="pinDist">13<small>m</small></span>
      <span class="pin-surface" id="pinSurface">Tee</span>
    </div>
    <div class="power" id="power"><div class="power-fill" id="powerFill"></div></div>
    <div class="carry" id="carry">0<small> m</small></div>
    <div class="skip" id="skip" hidden>Tap to skip</div>
    <div class="stage-msg" id="stageMsg" hidden><p>The 3D engine could not load. Check your connection and reload the page.</p></div>
  </main>

  <div class="clubs" id="clubs" role="group" aria-label="Shot type">
    <button class="club" id="modeChip" type="button" aria-pressed="true">
      <svg viewBox="0 0 26 22" aria-hidden="true"><path d="M3 18c3-13 12-16 20-8"/><path d="M19 7l4 3-1 5"/></svg>
      <span class="club-text"><span class="club-name">Chip</span><span class="club-desc">Fly over gaps</span></span>
    </button>
    <button class="club" id="modePutt" type="button" aria-pressed="false">
      <svg viewBox="0 0 26 22" aria-hidden="true"><path d="M3 15h18"/><path d="M17 11l4 4-4 4"/><circle cx="6" cy="15" r="2.5"/></svg>
      <span class="club-text"><span class="club-name">Putt</span><span class="club-desc">Roll it</span></span>
    </button>
  </div>

  <footer class="tip" id="tip"><strong>Drag back</strong> anywhere on the screen, then let go to hit</footer>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-live="polite">
      <p class="eyebrow" id="ovEyebrow">Hole 1 · Par 2</p>
      <h2 id="ovTitle">Par</h2>
      <p class="sub" id="ovSub">2 strokes</p>
      <div id="ovBody"></div>
      <button class="btn" id="ovBtn" type="button">Next hole</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const stage = $('stage');
  const tip = $('tip');
  const hud = {
    hole: $('hudHole'), par: $('hudPar'), strokes: $('hudStrokes'), strokesSub: $('hudStrokesSub'),
    score: $('hudScore'), scoreSub: $('hudScoreSub'),
  };
  const pinDist = $('pinDist'), pinSurface = $('pinSurface');
  const powerEl = $('power'), powerFill = $('powerFill'), carryEl = $('carry'), skipEl = $('skip'), stageMsg = $('stageMsg');
  const modeBtns = { chip: $('modeChip'), putt: $('modePutt') };
  const overlay = $('overlay');
  const ov = { eyebrow: $('ovEyebrow'), title: $('ovTitle'), sub: $('ovSub'), body: $('ovBody'), btn: $('ovBtn') };
  const btnSound = $('btnSound');
  const btnRestart = $('btnRestart');
  const restartIcon = btnRestart.querySelector('svg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!window.THREE) { stageMsg.hidden = false; return; }
  const THREE = window.THREE;

  // ---------- tuning ----------
  const G = 30;                 // toy gravity: snappy arcs
  const R = 0.5;                // ball radius
  const HOLE_R = 0.78;
  const MAX_DRAG = 150;         // css px of drag for full power
  const MIN_DRAG = 12;
  const MAX_OVER_PAR = 5;
  const CHIP = { angle: 50, min: 7, max: 27 };
  const PUTT = { min: 3, max: 19 };
  const PLAT_THICK = 3.4;
  const WALL_H = 0.9, WALL_T = 0.5;
  const SURF = { turf: { decel: 7, bounce: 0.42, grip: 0.72, label: 'Turf', cls: '' }, green: { decel: 6, bounce: 0.42, grip: 0.72, label: 'Green', cls: 'green' }, sand: { decel: 30, bounce: 0.05, grip: 0.95, label: 'Sand', cls: 'sand' } };
  const PAL = {
    turf: 0x4fc45f, green: 0x9be87c, dirt: 0x9a6238, dirtDark: 0x6e4429, wall: 0xfff4d6, wallSide: 0xe8d7b0,
    sand: 0xf2dc9b, bumper: 0xff5a5f, bumperCap: 0xfff4f4, pad: 0xffb703, padRing: 0xfff1c9,
    flag: 0xff5a5f, pole: 0xffffff, cup: 0x1a2320, cupRim: 0xf5f5f0, ball: 0xffffff, cloud: 0xffffff,
    accent: 0xf5c84c, lime: '#b9f04a', amber: '#f5c84c', red: '#e5533d',
  };

  // Map coordinates: x to the right, y up the screen. Platforms are [x0, y0, x1, y1] with top height e.
  // "open" lists edges (n, s, e, w) that get no wall.
  const HOLES = [
    { name: 'First Hop', par: 2, tee: [5, 3], hole: [5, 16], hint: 'Drag back and let go. Chip flies, Putt rolls',
      plats: [{ r: [0, 0, 10, 20], e: 0 }] },
    { name: 'The Gap', par: 3, tee: [5, 3], hole: [5, 18], hint: 'Chip it over the gap',
      plats: [{ r: [0, 0, 10, 9], e: 0, open: 'n' }, { r: [0, 13, 10, 22], e: 0, open: 's' }] },
    { name: 'Step Up', par: 3, tee: [5, 3], hole: [5, 16], hint: 'The green is up top. Chip high and land it',
      plats: [{ r: [0, 0, 10, 9], e: 0, open: 'n' }, { r: [0, 10, 10, 20], e: 3, open: 's' }] },
    { name: 'Bumper Alley', par: 3, tee: [5, 3], hole: [5, 21], hint: 'Red bumpers kick the ball. Sand kills it',
      plats: [{ r: [0, 0, 10, 24], e: 0 }], bumpers: [[3, 8], [7, 12], [3, 16]], sand: [[0, 18, 3, 24], [7, 18, 10, 24]] },
    { name: 'Islands', par: 4, tee: [4, 3], hole: [6, 21], hint: 'Island to island. Land it, then go again',
      plats: [{ r: [0, 0, 8, 8], e: 0 }, { r: [10, 6, 18, 14], e: 0 }, { r: [2, 16, 10, 24], e: 0 }] },
    { name: 'Jump Pad', par: 3, tee: [5, 2], hole: [5, 21], hint: 'Putt hard over the orange pad to launch',
      plats: [{ r: [0, 0, 10, 10], e: 0, open: 'n' }, { r: [0, 15, 10, 25], e: 5, open: 's' }], pads: [[5, 8]] },
    { name: 'Sandbox', par: 3, tee: [6, 3], hole: [6, 21], hint: 'Chip over the sand or thread the path',
      plats: [{ r: [0, 0, 12, 24], e: 0 }], sand: [[0, 7, 5, 17], [7, 7, 12, 17]], bumpers: [[6, 12]] },
    { name: 'The Tower', par: 4, tee: [5, 3], hole: [10, 18], hint: 'Three floors up. Take the stairs',
      plats: [{ r: [0, 0, 10, 8], e: 0 }, { r: [12, 4, 20, 12], e: 2 }, { r: [6, 14, 14, 22], e: 4 }] },
    { name: 'Grand Finale', par: 5, tee: [5, 3], hole: [6, 27], hint: 'Everything at once. Good luck',
      plats: [{ r: [0, 0, 10, 8], e: 0, open: 'n' }, { r: [0, 11, 10, 17], e: 0, open: 'ns' }, { r: [0, 20, 12, 30], e: 2, open: 's' }],
      bumpers: [[3, 14], [7, 14]], sand: [[0, 22, 12, 24]] },
  ];
  const TOTAL_PAR = HOLES.reduce((s, h) => s + h.par, 0);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const mz = (my) => -my; // map y -> world z

  // ---------- scene ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { stageMsg.hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, 1, 0.5, 400);
  scene.add(new THREE.HemisphereLight(0xe8f4ff, 0x6a8f5a, 0.42));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.72);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);

  const mat = {
    turf: new THREE.MeshToonMaterial({ color: PAL.turf }),
    green: new THREE.MeshToonMaterial({ color: PAL.green }),
    dirt: new THREE.MeshToonMaterial({ color: PAL.dirt }),
    wall: new THREE.MeshToonMaterial({ color: PAL.wall }),
    sand: new THREE.MeshToonMaterial({ color: PAL.sand }),
    bumper: new THREE.MeshToonMaterial({ color: PAL.bumper }),
    bumperCap: new THREE.MeshToonMaterial({ color: PAL.bumperCap }),
    pad: new THREE.MeshToonMaterial({ color: PAL.pad }),
    padRing: new THREE.MeshToonMaterial({ color: PAL.padRing }),
    flag: new THREE.MeshToonMaterial({ color: PAL.flag, side: THREE.DoubleSide }),
    pole: new THREE.MeshToonMaterial({ color: PAL.pole }),
    cup: new THREE.MeshBasicMaterial({ color: PAL.cup }),
    cupRim: new THREE.MeshBasicMaterial({ color: PAL.cupRim }),
    cloud: new THREE.MeshToonMaterial({ color: PAL.cloud }),
    ball: new THREE.MeshToonMaterial({ color: PAL.ball }),
  };

  const holeGroup = new THREE.Group();
  scene.add(holeGroup);
  const cloudGroup = new THREE.Group();
  scene.add(cloudGroup);

      const sp = CHIP.min + (CHIP.max - CHIP.min) * p;
      const a = CHIP.angle * Math.PI / 180;
      b.vx = dx * Math.cos(a) * sp; b.vz = dz * Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.grounded = false;
    }
  }
  function shoot(dx, dz, p) {
    launch(dx, dz, p, ball);
    ball.lastX = ball.x; ball.lastY = ball.y; ball.lastZ = ball.z;
    ball.shotT = 0; ball.padCool = 0;
    game.strokes++; game.shots++;
    game.state = 'shot';
    updateHud();
    if (game.mode === 'putt') sfx.putt(p); else sfx.chip(p);
    buzz(12);
  }
  function endIntro() { game.state = 'idle'; camDistNow = camDist; skipEl.hidden = true; }

  btnSound.addEventListener('click', () => {
    initAudio();
    game.muted = !game.muted;
    applyMuteUi();
    try { localStorage.setItem('pocketGolf.muted', game.muted ? '1' : '0'); } catch (e) { /* optional */ }
  });
  function applyMuteUi() {
    btnSound.setAttribute('aria-pressed', String(!game.muted));
    btnSound.setAttribute('aria-label', game.muted ? 'Sound off' : 'Sound on');
    btnSound.querySelectorAll('.wave').forEach((el) => { el.hidden = game.muted; });
    btnSound.querySelector('.mute').hidden = !game.muted;
  }
  btnRestart.addEventListener('click', () => {
    if (game.state === 'holeDone' || game.state === 'courseDone') return;
    if (game.strokes === 0 && (game.state === 'idle' || game.state === 'intro')) return;
    if (!restartArmed) {
      restartArmed = setTimeout(() => { restartArmed = 0; btnRestart.classList.remove('armed'); btnRestart.textContent = ''; btnRestart.appendChild(restartIcon); }, 2200);
      btnRestart.classList.add('armed');
      btnRestart.textContent = 'Sure?';
      return;
    }
    clearTimeout(restartArmed); restartArmed = 0;
    btnRestart.classList.remove('armed');
    btnRestart.textContent = ''; btnRestart.appendChild(restartIcon);
    loadHole(game.holeIndex, false);
    toast('<strong>Hole restarted</strong>', 1500);
  });

  // ---------- physics ----------
  // Returns the highest solid top directly under (x, z) that is within `reach` below y - R, or null.
  function supportBelow(x, z, y, reach) {
    let best = null;
    for (const s of cur.solids) {
      if (x < s.minX - 0.15 || x > s.maxX + 0.15 || z < s.minZ - 0.15 || z > s.maxZ + 0.15) continue;
      const gap = (y - R) - s.maxY;
      if (gap > -0.3 && gap < reach && (best === null || s.maxY > best)) best = s.maxY;
    }
    return best;
  }
  // Circle-vs-box push out. Returns {nx, ny, nz, vn} for the contact or null.
  function collideSolids(b, live) {
    let hit = null;
    for (const s of cur.solids) {
      const cx = clamp(b.x, s.minX, s.maxX), cy = clamp(b.y, s.minY, s.maxY), cz = clamp(b.z, s.minZ, s.maxZ);
      const dx = b.x - cx, dy = b.y - cy, dz = b.z - cz;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 >= R * R) continue;
      let nx, ny, nz, pen;
      if (d2 > 1e-8) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; nz = dz / d; pen = R - d; }
      else {
        // centre inside the box: leave through the nearest face
        const l = b.x - s.minX, r = s.maxX - b.x, bo = b.y - s.minY, t = s.maxY - b.y, f = b.z - s.minZ, k = s.maxZ - b.z;
        const m = Math.min(l, r, bo, t, f, k);
        nx = ny = nz = 0;
        if (m === t) ny = 1; else if (m === l) nx = -1; else if (m === r) nx = 1; else if (m === f) nz = -1; else if (m === k) nz = 1; else ny = -1;
        pen = m + R;
      }
      b.x += nx * pen; b.y += ny * pen; b.z += nz * pen;
      const vn = b.vx * nx + b.vy * ny + b.vz * nz;
      if (vn < 0) {
        if (ny > 0.7) {
          // landing on a top face
          const P = SURF[surfaceAt(b.x, b.z)];
          const tx = b.vx - vn * nx, ty = b.vy - vn * ny, tz = b.vz - vn * nz;
          b.vx = tx * P.grip - vn * nx * P.bounce; b.vy = ty * P.grip - vn * ny * P.bounce; b.vz = tz * P.grip - vn * nz * P.bounce;
          if (b.vy < 2.2) { b.vy = 0; b.grounded = true; }
          if (live && !b.wasGrounded) { const p = Math.min(1, -vn / 22); sfx.land(p); if (p > 0.25) buzz(8); }
        } else {
          b.vx -= 1.78 * vn * nx; b.vy -= 1.78 * vn * ny; b.vz -= 1.78 * vn * nz;
          if (live && -vn > 1.5 && time - lastWallSound > 0.06) { lastWallSound = time; sfx.wall(Math.min(1, -vn / 18)); }
        }
        hit = { nx, ny, nz, vn };
      }
    }
    return hit;
  }
  let lastWallSound = 0;

  // One physics step for body b (the ball, or the preview ghost). Returns an event string or null.
  function stepBody(b, h, live) {
    b.wasGrounded = b.grounded;
    if (b.grounded) {
      const sup = supportBelow(b.x, b.z, b.y, 0.35);
      if (sup === null) { b.grounded = false; }
      else {
        b.y = sup + R;
        const P = SURF[surfaceAt(b.x, b.z)];
        // the cup pulls a slow ball in
        const hx = cur.hx - b.x, hz = cur.hz - b.z, hd = Math.hypot(hx, hz);
        let sp = Math.hypot(b.vx, b.vz);
        const onGreenLevel = Math.abs(sup - cur.holePlat.top) < 0.05;
        if (onGreenLevel && hd < HOLE_R * 2.2 && sp < 9 && hd > 0.01) { b.vx += (hx / hd) * 14 * h; b.vz += (hz / hd) * 14 * h; }
        sp = Math.hypot(b.vx, b.vz);
        if (sp > 0) { const ns = Math.max(0, sp - P.decel * h); b.vx *= ns / sp; b.vz *= ns / sp; }
        b.vy = 0;
        // jump pads
        for (const p of cur.pads) {
          if (Math.abs(sup - p.top) < 0.05 && Math.hypot(b.x - p.x, b.z - p.z) < 1.0 && b.padCool <= 0) {
            b.vy = 20; b.grounded = false; b.padCool = 0.5;
            const spd = Math.hypot(b.vx, b.vz);
            if (spd < 5 && spd > 0) { b.vx *= 5 / spd; b.vz *= 5 / spd; }
            if (live) { p.hit = time; sfx.pad(); buzz(15); }
          }
        }
      }
    }
    if (!b.grounded) b.vy -= G * h;
    b.padCool -= h;
    b.x += b.vx * h; b.y += b.vy * h; b.z += b.vz * h;
    collideSolids(b, live);
    // bumpers
    for (const bp of cur.bumpers) {
      if (b.y - R > bp.top + 1.3 || b.y + R < bp.top) continue;
      const dx = b.x - bp.x, dz = b.z - bp.z;
      const d = Math.hypot(dx, dz), min = R + bp.r;
      if (d >= min || d === 0) continue;
      const nx = dx / d, nz = dz / d;
      b.x = bp.x + nx * min; b.z = bp.z + nz * min;
      const vn = b.vx * nx + b.vz * nz;
      if (vn < 0) {
        b.vx -= 2.15 * vn * nx; b.vz -= 2.15 * vn * nz;
        const s = Math.hypot(b.vx, b.vz);
        if (s < 9) { b.vx *= 9 / s; b.vz *= 9 / s; }
        if (live) { bp.hit = time; sfx.bumper(); buzz(15); }
      }
    }
    if (b.grounded) {
      const hd = Math.hypot(cur.hx - b.x, cur.hz - b.z);
      const sp = Math.hypot(b.vx, b.vz);
      const onGreenLevel = Math.abs((b.y - R) - cur.holePlat.top) < 0.05;
      if (onGreenLevel && hd < HOLE_R && sp < 8) return 'sink';
      if (sp < 0.15) { b.vx = b.vz = 0; return 'stop'; }
    }
    if (b.y < cur.floor) return 'fall';
    return null;
  }

  function update(dt) {
    time += dt;
    updateConfetti(dt);
    cloudGroup.children.forEach((c) => { c.position.x = c.userData.baseX + (reduceMotion ? 0 : Math.sin(time * 0.15 + c.userData.phase) * 1.5); });
    for (const bp of cur.bumpers) { const k = Math.max(0, 1 - (time - bp.hit) / 0.25); const s = 1 + k * 0.25; bp.mesh.scale.set(s, 1, s); bp.cap.scale.set(s, 1, s); }
    for (const p of cur.pads) { const k = Math.max(0, 1 - (time - p.hit) / 0.3); p.mesh.scale.set(1 + k * 0.3, 1 + k * 3, 1 + k * 0.3); }
    if (flagMesh) flagMesh.rotation.y = reduceMotion ? 0 : Math.sin(time * 3) * 0.2;

    if (game.state === 'intro') {
      introT += dt;
      const t = clamp(introT / 0.9, 0, 1);
      camDistNow = mix(camDist * 1.7, camDist, t * t * (3 - 2 * t));
      if (introT >= 1.0) endIntro();
      return;
    }
    if (game.state === 'sinking') {
      sinkT += dt;
      const k = Math.min(1, sinkT / 0.35);
      ball.x += (cur.hx - ball.x) * Math.min(1, dt * 14);
      ball.z += (cur.hz - ball.z) * Math.min(1, dt * 14);
      ball.y = cur.holePlat.top + R - k * 1.4;
      if (k >= 1) { ballMesh.visible = false; finishHole(false); }
      return;
    }
    if (game.state === 'penalty') {
      penaltyT += dt;
      if (penaltyT >= 1.0) {
        ball.x = ball.lastX; ball.y = ball.lastY; ball.z = ball.lastZ;
        ball.vx = ball.vy = ball.vz = 0; ball.grounded = true;
        ballMesh.visible = true;
        game.strokes++;
        updateHud();
        settle();
      }
      return;
    }
    if (game.state !== 'shot') return;

    let remaining = dt;
    const sub = 1 / 240;
    ball.shotT += dt;
    while (remaining > 0) {
      const h = Math.min(sub, remaining); remaining -= h;
      const ev = stepBody(ball, h, true);
      if (ev === 'sink') {
        game.state = 'sinking'; sinkT = 0;
        ball.vx = ball.vy = ball.vz = 0;
        sfx.sink(); buzz([20, 40, 60]);
        burstConfetti(cur.hx, cur.holePlat.top, cur.hz);
        return;
      }
      if (ev === 'stop' || ball.shotT > 20) {
        ball.vx = ball.vy = ball.vz = 0;
        settle();
        return;
      }
      if (ev === 'fall') {
        game.state = 'penalty'; penaltyT = 0;
        ball.vx = ball.vy = ball.vz = 0;
        ballMesh.visible = false;
        sfx.fall(); buzz([10, 30, 10]);
        toast('<strong>Off the edge!</strong> One stroke penalty, back you go', 2400);
        return;
      }
    }
  }
  function settle() {
    if (game.strokes >= cur.def.par + MAX_OVER_PAR) { finishHole(true); return; }
    game.state = 'idle';
    autoMode();
  }

  // ---------- aim preview ----------
  const ghost = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, grounded: true, padCool: 0, wasGrounded: true };
  const _c1 = new THREE.Color(), _c2 = new THREE.Color();
  function powerColor(p) {
    if (p < 0.5) return _c1.set(PAL.lime).lerp(_c2.set(PAL.amber), p * 2);
    return _c1.set(PAL.amber).lerp(_c2.set(PAL.red), (p - 0.5) * 2);
  }
  function hideAim() {
    dots.visible = false; landRing.visible = false;
    powerEl.classList.remove('on'); carryEl.classList.remove('on');
  }
  function drawAim() {
    const s = shotFromDrag();
    if (s.len < MIN_DRAG) { hideAim(); return; }
    const p = Math.max(0.06, s.p);
    ghost.x = ball.x; ghost.y = ball.y; ghost.z = ball.z; ghost.padCool = 0;
    launch(s.x, s.z, p, ghost);
    const chip = game.mode === 'chip';
    const arr = dotGeo.attributes.position.array;
    let n = 0, t = 0, steps = 0, ended = false, landed = false;
    const h = 1 / 120;
    const every = chip ? 2 : 6;
    let lx = ball.x, ly = ball.y, lz = ball.z;
    while (t < 6 && n < MAX_DOTS && !ended) {
      const ev = stepBody(ghost, h, false);
      t += h; steps++;
      if (steps % every === 0) { arr[n * 3] = ghost.x; arr[n * 3 + 1] = ghost.y + 0.05; arr[n * 3 + 2] = ghost.z; n++; }
      if (chip && ghost.grounded && !landed) { landed = true; lx = ghost.x; ly = ghost.y; lz = ghost.z; ended = true; }
      if (ev === 'stop' || ev === 'sink' || ev === 'fall') { ended = true; if (!landed) { lx = ghost.x; ly = ghost.y; lz = ghost.z; } }
    }
    if (!landed && !ended) { lx = ghost.x; ly = ghost.y; lz = ghost.z; }
    dotGeo.attributes.position.needsUpdate = true;
    dotGeo.setDrawRange(0, n);
    const col = powerColor(p);
    dotMat.color.copy(col);
    dots.visible = n > 0;
    const sup = supportBelow(lx, lz, ly + 0.5, 3);
    landRing.visible = sup !== null;
    if (sup !== null) landRing.position.set(lx, sup + 0.06, lz);
    landRing.material.color.copy(col);
    powerEl.classList.add('on'); carryEl.classList.add('on');
    powerFill.style.height = `${Math.round(p * 100)}%`;
    powerFill.style.background = '#' + col.getHexString();
    const dist = Math.round(Math.hypot(lx - ball.x, lz - ball.z));
    carryEl.innerHTML = `${dist}<small> m ${chip ? 'carry' : 'roll'}</small>`;
  }

  // ---------- scoring ----------
  function scoreLabel(strokes, par) {
    const d = strokes - par;
    if (strokes === 1) return 'Hole in one!';
    if (d <= -3) return 'Albatross!';
    if (d === -2) return 'Eagle!';
    if (d === -1) return 'Birdie!';
    if (d === 0) return 'Par';
    if (d === 1) return 'Bogey';
    if (d === 2) return 'Double bogey';
    if (d === 3) return 'Triple bogey';
    return `${d} over`;
  }
  function markClass(strokes, par) {
    const d = strokes - par;
    if (d <= -2) return 'mark eagle';
    if (d === -1) return 'mark birdie';
    if (d === 1) return 'mark bogey';
    if (d >= 2) return 'mark double';
    return 'mark';
  }
  function showOverlay(o) {
    ov.eyebrow.textContent = o.eyebrow;
    ov.title.textContent = o.title;
    ov.title.classList.toggle('gold', !!o.gold);
    ov.sub.textContent = o.sub;
    ov.body.innerHTML = o.body || '';
    ov.btn.textContent = o.button;
    ov.btn.onclick = () => { initAudio(); overlay.hidden = true; o.onClick(); };
    overlay.hidden = false;
    ov.btn.focus({ preventScroll: true });
  }
  function finishHole(pickedUp) {
    game.scores[game.holeIndex] = game.strokes;
    game.state = 'holeDone';
    updateHud();
    const par = cur.def.par;
    const last = game.holeIndex === HOLES.length - 1;
    const d = game.strokes - par;
    setTimeout(() => {
      showOverlay({
        eyebrow: `Hole ${game.holeIndex + 1} · ${cur.def.name} · Par ${par}`,
        title: pickedUp ? 'Picked up' : scoreLabel(game.strokes, par),
        gold: !pickedUp && d < 0,
        sub: pickedUp
          ? `Max ${game.strokes} strokes on this hole`
          : `${game.strokes} stroke${game.strokes === 1 ? '' : 's'}, ${d === 0 ? 'level par' : fmtPar(d) + ' on this hole'}`,
        button: last ? 'See the scorecard' : 'Next hole',
        onClick: () => { if (last) finishCourse(); else loadHole(game.holeIndex + 1, true); },
      });
    }, pickedUp ? 250 : 700);
  }
  function finishCourse() {
    game.state = 'courseDone';
    const total = game.scores.reduce((s, v) => s + v, 0);
    const d = total - TOTAL_PAR;
    let best = null;
    try {
      const prev = parseInt(localStorage.getItem('pocketGolf.best'), 10);
      best = Number.isFinite(prev) ? prev : null;
      if (best === null || total < best) localStorage.setItem('pocketGolf.best', String(total));
    } catch (e) { /* storage is optional */ }
    const isNewBest = best === null || total < best;
    const cells = (fn) => HOLES.map((h, i) => `<td>${fn(h, i)}</td>`).join('');
    const body = `
      <table class="scorecard" aria-label="Scorecard">
        <tr><th>Hole</th>${cells((h, i) => i + 1)}<td>Tot</td></tr>
        <tr><th>Par</th>${cells((h) => h.par)}<td>${TOTAL_PAR}</td></tr>
        <tr><th>You</th>${cells((h, i) => `<span class="${markClass(game.scores[i], h.par)}">${game.scores[i]}</span>`)}<td>${total}</td></tr>
      </table>
      <p class="legend">Circle for birdie, double circle for eagle, square for bogey, double square for worse.</p>
      <p class="best">${isNewBest ? '<strong>New best round</strong>' : `Your best round is <strong>${best}</strong>`}</p>`;
    showOverlay({
      eyebrow: 'Round complete · 9 holes',
      title: d === 0 ? 'Level par' : (d < 0 ? `${-d} under par` : `${d} over par`),
      gold: d < 0,
      sub: `${total} strokes, par ${TOTAL_PAR}`,
      body,
      button: 'Play again',
      onClick: () => { game.scores = []; game.shots = 0; loadHole(0, true); },
    });
  }

  // ---------- render loop ----------
  function resize() {
    const r = stage.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (cur) { fitCamera(); if (game.state !== 'intro') camDistNow = camDist; placeCamera(); }
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    placeCamera();
    if (game.state === 'aiming' && aim) drawAim();
    ballMesh.position.set(ball.x, ball.y, ball.z);
    if (game.state === 'idle' && !reduceMotion) { const s = 1 + Math.sin(time * 4) * 0.03; ballMesh.scale.set(s, s, s); } else ballMesh.scale.set(1, 1, 1);
    updatePin();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function start(saved) {
    try { game.muted = localStorage.getItem('pocketGolf.muted') === '1'; } catch (e) { /* optional */ }
    applyMuteUi();
    if (saved && Array.isArray(saved.scores) && Number.isInteger(saved.holeIndex) && saved.holeIndex < HOLES.length) {
      game.scores = saved.scores.slice(0, saved.holeIndex);
      game.shots = saved.shots || 0;
      loadHole(saved.holeIndex, true);
    } else {
      loadHole(0, true);
    }
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ holeIndex: game.holeIndex, scores: game.scores, shots: game.shots }));
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
})();
</script>
</body>
</html>
