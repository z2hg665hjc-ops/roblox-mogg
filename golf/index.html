<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Golf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  :root {
    --bg: #0f1f16;
    --panel: #17301f;
    --panel-2: #1f3d28;
    --line: rgba(255, 255, 255, .09);
    --ink: #f4f7ee;
    --muted: #9db3a2;
    --accent: #f5c84c;
    --accent-shade: #b8912a;
    --accent-ink: #1d1a0a;
    --danger: #e5533d;
    --display: 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', sans-serif;
    --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
    height: 100%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 600 15px/1.4 var(--body);
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }

  .app {
    position: relative;
    height: 100%;
    width: 100%;
    overflow: hidden;
    max-width: 560px;
    margin: 0 auto;
    padding-inline: 16px;
    display: flex;
    flex-direction: column;
  }

  .hud {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr) auto;
    align-items: end;
    gap: 8px;
    padding-block: 10px 8px;
  }
  .stat { display: flex; flex-direction: column; line-height: 1; min-width: 0; }
  .stat-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-value {
    font-family: var(--display);
    font-size: 30px;
    font-variant-numeric: tabular-nums;
    margin-top: 5px;
    letter-spacing: .01em;
  }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; align-self: center; }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    display: grid; place-items: center;
    cursor: pointer;
    padding: 0;
    font: 800 12px var(--body);
  }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn:focus-visible, .btn:focus-visible, .club:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon-btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

  .stage {
    flex: 1; min-height: 0; min-width: 0;
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    background: #9fd3f5;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
  }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  .pin {
    position: absolute; top: 10px; left: 10px;
    display: flex; flex-direction: column; gap: 2px;
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(10, 24, 16, .62);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
    line-height: 1;
  }
  .pin-dist { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
  .pin-dist small { font-family: var(--body); font-size: 12px; font-weight: 800; color: var(--muted); margin-left: 2px; }
  .pin-surface { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .pin-surface.green { color: #b9f04a; }
  .pin-surface.sand { color: #f0dc9a; }
  .pin-surface.rough { color: #f2b26b; }

  .power {
    position: absolute; left: 12px; bottom: 16px;
    width: 14px; height: 42%;
    border-radius: 8px;
    background: rgba(10, 24, 16, .55);
    border: 1px solid rgba(255, 255, 255, .18);
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .power.on { opacity: 1; }
  .power-fill {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 0%;
    background: var(--accent);
    border-radius: 8px;
  }
  .carry {
    position: absolute; left: 32px; bottom: 16px;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(10, 24, 16, .62);
    font-family: var(--display);
    font-size: 18px;
    line-height: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
  }
  .carry small { font-family: var(--body); font-size: 11px; font-weight: 800; color: var(--muted); }
  .carry.on { opacity: 1; }
  .skip {
    position: absolute; right: 10px; bottom: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, .25);
    background: rgba(10, 24, 16, .62);
    color: var(--ink);
    font: 800 12px var(--body);
    letter-spacing: .06em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .stage-msg {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 24px;
    text-align: center;
    background: var(--bg);
    color: var(--ink);
  }
  .stage-msg p { max-width: 30ch; margin: 0; }

  .clubs {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    padding-block: 10px 0;
  }
  .club {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 14px;
    padding: 8px 4px 7px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    line-height: 1;
    min-width: 0;
  }
  .club-name { font-family: var(--display); font-size: 16px; letter-spacing: .01em; }
  .club-desc { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .club[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .club[aria-pressed="true"] .club-desc { color: rgba(29, 26, 10, .7); }
  .club:disabled { opacity: .45; cursor: default; }

  .tip {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    padding-block: 8px 10px;
    min-height: 38px;
  }
  .tip strong { color: var(--ink); font-weight: 800; }

  .overlay {
    position: absolute; inset: 0;
    z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(8, 18, 12, .6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px 20px 20px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    animation: pop .38s cubic-bezier(.2, .9, .3, 1.15);
  }
  .eyebrow {
    margin: 0;
    font-size: 11px; font-weight: 800;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted);
  }
  .card h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 44px;
    line-height: 1.05;
    margin: 8px 0 6px;
    text-wrap: balance;
  }
  .card h2.gold { color: var(--accent); }
  .card .sub { margin: 0 0 18px; color: var(--muted); }
  .card .best { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .card .best strong { color: var(--accent); }
  .btn {
    width: 100%;
    min-height: 54px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: var(--display);
    font-size: 21px;
    letter-spacing: .02em;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-shade);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-shade); }

  .scorecard {
    width: 100%;
    border-collapse: collapse;
    margin: 4px 0 14px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    table-layout: fixed;
  }
  .scorecard th {
    text-align: left;
    color: var(--muted);
    font-weight: 800;
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 2px;
    width: 42px;
  }
  .scorecard td { text-align: center; padding: 5px 0; }
  .scorecard tr + tr td, .scorecard tr + tr th { border-top: 1px solid var(--line); }
  .scorecard td:last-child, .scorecard th:last-child { border-left: 1px solid var(--line); font-weight: 800; }
  .mark {
    display: inline-grid; place-items: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-weight: 800;
  }
  .mark.birdie { box-shadow: 0 0 0 1.5px var(--ink); }
  .mark.eagle { box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 3px var(--panel), 0 0 0 4.5px var(--ink); }
  .mark.bogey { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink); }
  .mark.double { border-radius: 4px; box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 3px var(--panel), 0 0 0 4.5px var(--ink); }
  .legend { font-size: 11px; color: var(--muted); margin: 0 0 16px; }

  @keyframes pop {
    from { transform: scale(.86) translateY(14px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .btn, .power, .carry { transition: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="stat">
      <span class="stat-label">Hole</span>
      <span class="stat-value" id="hudHole">1</span>
      <span class="stat-sub" id="hudPar">of 9 · Par 3</span>
    </div>
    <div class="stat">
      <span class="stat-label">Strokes</span>
      <span class="stat-value" id="hudStrokes">0</span>
      <span class="stat-sub" id="hudStrokesSub">this hole</span>
    </div>
    <div class="stat">
      <span class="stat-label">To par</span>
      <span class="stat-value" id="hudScore">E</span>
      <span class="stat-sub" id="hudScoreSub">0 holes done</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="btnSound" type="button" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 9a4 4 0 0 1 0 6"/><path class="wave" d="M18.5 6.5a8 8 0 0 1 0 11"/><path class="mute" d="M16 9l5 6M21 9l-5 6" hidden/></svg>
      </button>
      <button class="icon-btn" id="btnRestart" type="button" aria-label="Restart this hole">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="c" aria-label="3D golf course. Drag back anywhere and release to hit the ball."></canvas>
    <div class="pin" aria-live="off">
      <span class="pin-dist" id="pinDist">125<small>m</small></span>
      <span class="pin-surface" id="pinSurface">Tee</span>
    </div>
    <div class="power" id="power"><div class="power-fill" id="powerFill"></div></div>
    <div class="carry" id="carry">0<small> m</small></div>
    <div class="skip" id="skip" hidden>Tap to skip</div>
    <div class="stage-msg" id="stageMsg" hidden><p>The 3D engine could not load. Check your connection and reload the page.</p></div>
  </main>

  <div class="clubs" id="clubs" role="group" aria-label="Club"></div>

  <footer class="tip" id="tip"><strong>Drag back</strong> anywhere on the screen, then let go to swing</footer>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-live="polite">
      <p class="eyebrow" id="ovEyebrow">Hole 1 · Par 3</p>
      <h2 id="ovTitle">Par</h2>
      <p class="sub" id="ovSub">3 strokes</p>
      <div id="ovBody"></div>
      <button class="btn" id="ovBtn" type="button">Next hole</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const canvas = $('c');
  const stage = $('stage');
  const tip = $('tip');
  const hud = {
    hole: $('hudHole'), par: $('hudPar'), strokes: $('hudStrokes'), strokesSub: $('hudStrokesSub'),
    score: $('hudScore'), scoreSub: $('hudScoreSub'),
  };
  const pinDist = $('pinDist'), pinSurface = $('pinSurface');
  const powerEl = $('power'), powerFill = $('powerFill'), carryEl = $('carry'), skipEl = $('skip'), stageMsg = $('stageMsg');
  const clubsEl = $('clubs');
  const overlay = $('overlay');
  const ov = { eyebrow: $('ovEyebrow'), title: $('ovTitle'), sub: $('ovSub'), body: $('ovBody'), btn: $('ovBtn') };
  const btnSound = $('btnSound');
  const btnRestart = $('btnRestart');
  const restartIcon = btnRestart.querySelector('svg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!window.THREE) { stageMsg.hidden = false; return; }
  const THREE = window.THREE;

  // ---------- tuning ----------
  const G = 9.81;
  const BALL_R = 0.5;          // exaggerated so the ball reads on a phone
  const HOLE_R = 0.9;
  const MAX_DRAG = 150;        // css px of drag for full power
  const MIN_DRAG = 12;
  const TIME_SCALE = 1.2;
  const MAX_OVER_PAR = 5;

  const CLUBS = [
    { id: 'driver', name: 'Driver', desc: 'Far', loft: 13, speed: 74 },
    { id: 'iron', name: 'Iron', desc: 'Mid', loft: 26, speed: 46 },
    { id: 'wedge', name: 'Wedge', desc: 'High', loft: 52, speed: 29 },
    { id: 'putter', name: 'Putter', desc: 'Roll', loft: 0, speed: 7.5 },
  ];
  // mu: rolling friction, e: bounce, fr: grip taken from the roll on landing
  const SURF = {
    green: { mu: 0.075, e: 0.35, fr: 0.45, label: 'Green', cls: 'green' },
    fairway: { mu: 0.15, e: 0.42, fr: 0.5, label: 'Fairway', cls: '' },
    rough: { mu: 0.38, e: 0.25, fr: 0.65, label: 'Rough', cls: 'rough' },
    sand: { mu: 0.9, e: 0.08, fr: 0.85, label: 'Bunker', cls: 'sand' },
    oob: { mu: 0.4, e: 0.25, fr: 0.6, label: 'Out of bounds', cls: 'rough' },
    bed: { mu: 1, e: 0, fr: 1, label: 'Water', cls: '' },
  };
  const PAL = {
    rough: '#4c8f3a', fairway: '#6dbb4a', green: '#93d95f', sand: '#e8d79c', oob: '#3f7a33', bed: '#2a6a86',
    water: 0x3aa7e0, sky: 0x9fd3f5, trunk: 0x7a5230, canopyA: 0x2f7a3e, canopyB: 0x3d9a4c,
    flag: 0xe5533d, pole: 0xf6f1e6, accent: 0xf5c84c, lime: '#b9f04a', amber: '#f5c84c', red: '#e5533d',
  };

  // Every hole: tee at the origin, play runs toward +z. Units are metres, a bit generous.
  const HOLES = [
    { name: 'Opener', par: 3, tee: [0, 0], hole: [0, 125], hint: 'Iron off the tee, then putt it home',
      fairway: [[0, 0, 14], [0, 120, 16]], green: 10,
      bunkers: [[9, 118, 4], [-10, 124, 3.5]],
      trees: [[-30, 30], [32, 40], [-34, 70], [30, 90], [-28, 110], [26, 145], [-22, 152]] },
    { name: 'Long Straight', par: 4, tee: [0, 0], hole: [4, 310], hint: 'Driver first, then a wedge in',
      fairway: [[0, 0, 15], [2, 170, 20], [4, 300, 16]], green: 11,
      bunkers: [[-24, 190, 6], [28, 210, 6], [16, 302, 4]],
      trees: [[-40, 40], [40, 60], [-42, 120], [44, 150], [-38, 200], [40, 250], [-36, 280], [30, 335], [-20, 345]] },
    { name: 'Dogleg Right', par: 4, tee: [0, 0], hole: [82, 300], hint: 'Lay up at the corner, or carry the trees',
      fairway: [[0, 0, 15], [0, 170, 20], [50, 250, 18], [82, 295, 14]], green: 10,
      bunkers: [[70, 285, 5], [96, 302, 5]],
      trees: [[30, 190], [38, 205], [32, 222], [44, 236], [26, 242], [-30, 50], [-34, 120], [-30, 190], [-20, 250], [112, 270], [102, 322], [60, 332]] },
    { name: 'Over the Pond', par: 3, tee: [0, 0], hole: [0, 155], hint: 'Carry the water. Short is wet',
      fairway: [[0, 0, 12], [0, 40, 12], [0, 130, 16], [0, 150, 16]], green: 11,
      water: [[0, 85, 34]], bunkers: [[-15, 160, 4]],
      trees: [[-42, 60], [42, 70], [-38, 130], [38, 140], [-24, 182], [22, 186]] },
    { name: 'The Long Haul', par: 5, tee: [0, 0], hole: [-20, 480], hint: 'Two big hits and a short one',
      fairway: [[0, 0, 15], [5, 200, 22], [-5, 340, 18], [-20, 470, 15]], green: 12,
      bunkers: [[32, 240, 7], [-30, 330, 6], [-36, 470, 5], [-6, 488, 4]],
      trees: [[-40, 60], [42, 100], [-46, 180], [48, 260], [-44, 300], [40, 380], [-48, 420], [22, 452], [-42, 502], [10, 508]] },
    { name: 'The Creek', par: 4, tee: [0, 0], hole: [-64, 290], hint: 'A creek crosses the fairway. Go over it, not into it',
      fairway: [[0, 0, 15], [0, 160, 20], [-40, 240, 18], [-64, 285, 14]], green: 10,
      streams: [[[-100, 142], [80, 126], 6]],
      bunkers: [[-82, 280, 5], [-50, 306, 4]],
      trees: [[36, 60], [-40, 80], [42, 200], [-8, 226], [12, 262], [-104, 250], [-92, 322], [-40, 322]] },
    { name: 'Island Green', par: 3, tee: [0, 0], hole: [0, 100], hint: 'Wedge it onto the island. Nothing else will do',
      fairway: [[0, 0, 12], [0, 30, 12]], green: 11,
      water: [[0, 100, 28]],
      trees: [[-42, 40], [42, 50], [-44, 142], [46, 152], [-30, 8], [32, 12]] },
    { name: 'The Gauntlet', par: 4, tee: [0, 0], hole: [10, 345], hint: 'Narrow all the way. Keep it straight',
      fairway: [[0, 0, 14], [4, 180, 13], [10, 335, 13]], green: 10,
      bunkers: [[-6, 342, 5], [27, 346, 5], [12, 362, 4], [-12, 200, 5], [26, 260, 5]],
      trees: [[-22, 40], [24, 60], [-24, 100], [26, 130], [-22, 170], [26, 212], [-20, 240], [28, 290], [-18, 300], [32, 322], [-14, 374], [34, 374]] },
    { name: 'The Finisher', par: 5, tee: [0, 0], hole: [-50, 505], hint: 'Bend it right, then left, then home',
      fairway: [[0, 0, 15], [10, 150, 20], [50, 280, 18], [0, 400, 18], [-50, 495, 14]], green: 12,
      water: [[82, 380, 30]],
      bunkers: [[-68, 495, 5], [-36, 517, 5], [32, 330, 7]],
      trees: [[-40, 60], [46, 90], [-30, 200], [-20, 282], [92, 240], [72, 442], [30, 462], [-82, 440], [-92, 522], [-20, 542]] },
  ];
  const TOTAL_PAR = HOLES.reduce((s, h) => s + h.par, 0);

  // ---------- small maths ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, t) => a + (b - a) * t;
  // 1 when d <= inner, 0 when d >= outer, smooth in between
  function smooth(outer, inner, d) {
    const t = clamp((outer - d) / (outer - inner), 0, 1);
    return t * t * (3 - 2 * t);
  }
  function distToSeg(px, pz, ax, az, bx, bz) {
    const vx = bx - ax, vz = bz - az;
    const l2 = vx * vx + vz * vz || 1;
    const t = clamp(((px - ax) * vx + (pz - az) * vz) / l2, 0, 1);
    const cx = ax + vx * t, cz = az + vz * t;
    return { d: Math.hypot(px - cx, pz - cz), t };
  }
  function hash2(a, b) {
    let h = (a * 374761393 + b * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- terrain ----------
  let cur = null; // prepared hole
  function baseHeight(x, z) {
    let h = 2.4 + 1.2 * Math.sin(x * 0.045 + 1.3) * Math.cos(z * 0.03)
      + 0.6 * Math.sin(z * 0.08 + x * 0.03) + 0.35 * Math.cos(x * 0.13 - z * 0.05);
    for (const m of cur.mounds) {
      const d2 = (x - m.x) * (x - m.x) + (z - m.z) * (z - m.z);
      if (d2 < m.r * m.r * 4) h += m.h * Math.exp(-d2 / (m.r * m.r));
    }
    return h;
  }
  function heightAt(x, z) {
    let h = baseHeight(x, z);
    for (const w of cur.waters) {
      const d = w.dist(x, z);
      if (d < w.r + 6) h = mix(h, -1.6, smooth(w.r + 6, w.r, d));
    }
    {
      const d = Math.hypot(x - cur.hx, z - cur.hz);
      if (d < cur.green + 9) h = mix(h, cur.greenLevel + (x - cur.hx) * 0.008, smooth(cur.green + 9, cur.green, d));
    }
    {
      const d = Math.hypot(x - cur.tx, z - cur.tz);
      if (d < 12) h = mix(h, cur.teeLevel, smooth(12, 7, d));
    }
    for (const b of cur.bunkers) {
      const d = Math.hypot(x - b.x, z - b.z);
      if (d < b.r + 2.5) h = mix(h, b.level, smooth(b.r + 2.5, b.r, d));
    }
    return h;
  }
  const _n = new THREE.Vector3();
  function normalAt(x, z) {
    const e = 0.4;
    const dx = (heightAt(x + e, z) - heightAt(x - e, z)) / (2 * e);
    const dz = (heightAt(x, z + e) - heightAt(x, z - e)) / (2 * e);
    return _n.set(-dx, 1, -dz).normalize();
  }
  function surfaceAt(x, z) {
    const b = cur.bounds;
    if (x < b.minX || x > b.maxX || z < b.minZ || z > b.maxZ) return 'oob';
    if (Math.hypot(x - cur.hx, z - cur.hz) < cur.green) return 'green';
    for (const k of cur.bunkers) if (Math.hypot(x - k.x, z - k.z) < k.r) return 'sand';
    for (const w of cur.waters) if (w.dist(x, z) < w.r) return 'bed';
    if (Math.hypot(x - cur.tx, z - cur.tz) < 7) return 'fairway';
    for (const s of cur.segs) {
      const r = distToSeg(x, z, s.ax, s.az, s.bx, s.bz);
      if (r.d < mix(s.ra, s.rb, r.t)) return 'fairway';
    }
    return 'rough';
  }

  function prepareHole(def, index) {
    const h = {
      def, tx: def.tee[0], tz: def.tee[1], hx: def.hole[0], hz: def.hole[1], green: def.green,
      segs: [], waters: [], bunkers: [], trees: [], mounds: [],
    };
    for (let i = 0; i < def.fairway.length - 1; i++) {
      const a = def.fairway[i], b = def.fairway[i + 1];
      h.segs.push({ ax: a[0], az: a[1], bx: b[0], bz: b[1], ra: a[2], rb: b[2] });
    }
    for (const [x, z, r] of (def.water || [])) h.waters.push({ r, dist: (px, pz) => Math.hypot(px - x, pz - z), pts: [[x - r, z - r], [x + r, z + r]] });
    for (const [a, b, r] of (def.streams || [])) h.waters.push({ r, dist: (px, pz) => distToSeg(px, pz, a[0], a[1], b[0], b[1]).d, pts: [a, b] });

    const xs = [h.tx, h.hx], zs = [h.tz, h.hz];
    for (const f of def.fairway) { xs.push(f[0] - f[2], f[0] + f[2]); zs.push(f[1]); }
    for (const w of h.waters) for (const p of w.pts) { xs.push(p[0] - w.r, p[0] + w.r); zs.push(p[1] - w.r, p[1] + w.r); }
    for (const t of def.trees) { xs.push(t[0]); zs.push(t[1]); }
    for (const b of (def.bunkers || [])) { xs.push(b[0]); zs.push(b[1]); }
    h.bounds = { minX: Math.min(...xs) - 42, maxX: Math.max(...xs) + 42, minZ: Math.min(...zs) - 40, maxZ: Math.max(...zs) + 60 };
    h.mesh = { minX: h.bounds.minX - 30, maxX: h.bounds.maxX + 30, minZ: h.bounds.minZ - 30, maxZ: h.bounds.maxZ + 40 };

    let seed = 1000 + index * 7919;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    cur = h;
    // rough hills, kept well away from the line of play
    for (let tries = 0; tries < 40 && h.mounds.length < 6; tries++) {
      const x = mix(h.mesh.minX, h.mesh.maxX, rnd()), z = mix(h.mesh.minZ, h.mesh.maxZ, rnd());
      let clear = Math.hypot(x - h.hx, z - h.hz) > 45 && Math.hypot(x - h.tx, z - h.tz) > 45;
      for (const s of h.segs) if (distToSeg(x, z, s.ax, s.az, s.bx, s.bz).d < 42) clear = false;
      for (const w of h.waters) if (w.dist(x, z) < w.r + 30) clear = false;
      if (clear) h.mounds.push({ x, z, r: 16 + rnd() * 14, h: 2 + rnd() * 3.5 });
    }
    h.greenLevel = baseHeight(h.hx, h.hz);
    h.teeLevel = baseHeight(h.tx, h.tz);
    for (const [x, z, r] of (def.bunkers || [])) {
      const level = heightAt(x, z) - 0.7;   // bunkers are not in cur.bunkers yet, so this is the lie without them
      h.bunkers.push({ x, z, r, level });
    }
    for (const [x, z] of def.trees) {
      const s = 0.85 + rnd() * 0.5;
      const surf = surfaceAt(x, z);
      if (surf !== 'rough' && surf !== 'oob') continue;
      h.trees.push({ x, z, y: heightAt(x, z), s, trunkR: 0.45 * s, trunkH: 2.6 * s, canopyBottom: 2.2 * s, top: 9.2 * s, canopyR: 2.9 * s, shade: rnd() < 0.5 });
    }
    return h;
  }

  // ---------- scene ----------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { stageMsg.hidden = false; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(PAL.sky);
  scene.fog = new THREE.Fog(PAL.sky, 140, 620);
  const camera = new THREE.PerspectiveCamera(58, 1, 0.2, 1200);
  scene.add(new THREE.HemisphereLight(0xdcefff, 0x3b6b2a, 0.7));
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.6);
  sun.position.set(80, 140, -60);
  scene.add(sun);

  const terrainMat = new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 0 });
  const waterMat = new THREE.MeshPhongMaterial({ color: PAL.water, transparent: true, opacity: 0.78, shininess: 90, specular: 0x88ccff });
  const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const trunkGeo = new THREE.CylinderGeometry(0.32, 0.5, 2.8, 6);
  const coneGeoA = new THREE.ConeGeometry(2.9, 5, 7);
  const coneGeoB = new THREE.ConeGeometry(2.1, 4.4, 7);
  const trunkMat = new THREE.MeshLambertMaterial({ color: PAL.trunk });
  const canopyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

  const holeGroup = new THREE.Group(); // terrain, water, trees, flag: rebuilt each hole
  scene.add(holeGroup);

  // clouds live in world space and are shared by all holes
  for (let i = 0; i < 14; i++) {
    const g = new THREE.IcosahedronGeometry(6 + hash2(i, 3) * 9, 0);
    const m = new THREE.Mesh(g, cloudMat);
    m.position.set(mix(-260, 260, hash2(i, 1)), 60 + hash2(i, 2) * 30, mix(-120, 620, hash2(i, 4)));
    m.scale.set(1.6, 0.45, 1);
    scene.add(m);
  }

  const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 20, 14), new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 70, specular: 0x777777 }));
  scene.add(ballMesh);
  const shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(BALL_R * 1.15, 18), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false }));
  shadowMesh.rotation.x = -Math.PI / 2;
  scene.add(shadowMesh);

  const dotTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.beginPath(); g.arc(16, 16, 13, 0, Math.PI * 2); g.fill();
    return new THREE.CanvasTexture(c);
  })();
  const MAX_DOTS = 200;
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MAX_DOTS * 3), 3));
  dotGeo.setDrawRange(0, 0);
  const dotMat = new THREE.PointsMaterial({ size: 0.9, sizeAttenuation: true, map: dotTex, transparent: true, alphaTest: 0.4, depthWrite: false, color: PAL.accent });
  const dots = new THREE.Points(dotGeo, dotMat);
  dots.frustumCulled = false;
  dots.visible = false;
  scene.add(dots);
  const landRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.4, 28), new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide }));
  landRing.rotation.x = -Math.PI / 2;
  landRing.visible = false;
  scene.add(landRing);

  let flagMesh = null, beaconMat = null;
  function buildHoleScene() {
    while (holeGroup.children.length) {
      const c = holeGroup.children.pop();
      if (c.geometry && c.userData.own) c.geometry.dispose();
    }
    // terrain
    const step = 2.5;
    const x0 = cur.mesh.minX, z0 = cur.mesh.minZ;
    const nx = Math.ceil((cur.mesh.maxX - x0) / step) + 1, nz = Math.ceil((cur.mesh.maxZ - z0) / step) + 1;
    const pos = new Float32Array(nx * nz * 3), col = new Float32Array(nx * nz * 3);
    const c = new THREE.Color();
    let i = 0;
    for (let iz = 0; iz < nz; iz++) {
      for (let ix = 0; ix < nx; ix++) {
        const x = x0 + ix * step, z = z0 + iz * step;
        const h = heightAt(x, z);
        pos[i * 3] = x; pos[i * 3 + 1] = h; pos[i * 3 + 2] = z;
        const s = h < 0 ? 'bed' : surfaceAt(x, z);
        c.set(PAL[s]);
        c.offsetHSL(0, 0, (hash2(ix, iz) - 0.5) * 0.07);
        col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        i++;
      }
    }
    const idx = [];
    for (let iz = 0; iz < nz - 1; iz++) {
      for (let ix = 0; ix < nx - 1; ix++) {
        const a = iz * nx + ix, b = a + 1, d = a + nx, e = d + 1;
        idx.push(a, d, b, b, d, e);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    const terrain = new THREE.Mesh(geo, terrainMat);
    terrain.userData.own = true;
    holeGroup.add(terrain);

    // water sheet at sea level; only shows where the ground dips below it
    const water = new THREE.Mesh(new THREE.PlaneGeometry(cur.mesh.maxX - x0, cur.mesh.maxZ - z0), waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.set((x0 + cur.mesh.maxX) / 2, 0, (z0 + cur.mesh.maxZ) / 2);
    water.userData.own = true;
    holeGroup.add(water);

    // trees
    const n = cur.trees.length;
    if (n) {
      const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, n);
      const conesA = new THREE.InstancedMesh(coneGeoA, canopyMat, n);
      const conesB = new THREE.InstancedMesh(coneGeoB, canopyMat, n);
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), sc = new THREE.Vector3();
      const cA = new THREE.Color(PAL.canopyA), cB = new THREE.Color(PAL.canopyB);
      cur.trees.forEach((t, k) => {
        sc.set(t.s, t.s, t.s);

        p.set(t.x, t.y + 1.4 * t.s, t.z); m.compose(p, q, sc); trunks.setMatrixAt(k, m);
        p.set(t.x, t.y + (2.2 + 2.5) * t.s, t.z); m.compose(p, q, sc); conesA.setMatrixAt(k, m);
        p.set(t.x, t.y + (5.0 + 2.2) * t.s, t.z); m.compose(p, q, sc); conesB.setMatrixAt(k, m);
        conesA.setColorAt(k, t.shade ? cA : cB);
        conesB.setColorAt(k, t.shade ? cB : cA);
      });
      holeGroup.add(trunks, conesA, conesB);
    }

    // tee markers
    for (const sx of [-2.4, 2.4]) {
      const mk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.7, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
      mk.position.set(cur.tx + sx, cur.teeLevel + 0.35, cur.tz);
      mk.userData.own = true;
      holeGroup.add(mk);
    }

    // cup and flag
    const cupY = heightAt(cur.hx, cur.hz);
    const rim = new THREE.Mesh(new THREE.CircleGeometry(HOLE_R + 0.25, 24), new THREE.MeshBasicMaterial({ color: 0x5a6b48 }));
    rim.rotation.x = -Math.PI / 2; rim.position.set(cur.hx, cupY + 0.03, cur.hz); rim.userData.own = true;
    const cup = new THREE.Mesh(new THREE.CircleGeometry(HOLE_R, 24), new THREE.MeshBasicMaterial({ color: 0x10140f }));
    cup.rotation.x = -Math.PI / 2; cup.position.set(cur.hx, cupY + 0.05, cur.hz); cup.userData.own = true;
    holeGroup.add(rim, cup);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 5, 8), new THREE.MeshLambertMaterial({ color: PAL.pole }));
    pole.position.set(cur.hx, cupY + 2.5, cur.hz); pole.userData.own = true;
    flagMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.15), new THREE.MeshLambertMaterial({ color: PAL.flag, side: THREE.DoubleSide }));
    flagMesh.geometry.translate(0.95, 0, 0);
    flagMesh.position.set(cur.hx, cupY + 4.35, cur.hz); flagMesh.userData.own = true;
    beaconMat = new THREE.MeshBasicMaterial({ color: PAL.accent, transparent: true, opacity: 0.3, depthWrite: false });
    const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 40, 10, 1, true), beaconMat);
    beacon.position.set(cur.hx, cupY + 20, cur.hz); beacon.userData.own = true;
    holeGroup.add(pole, flagMesh, beacon);
  }

  // ---------- state ----------
  const game = { holeIndex: 0, strokes: 0, scores: [], state: 'intro', muted: false, club: 1, shots: 0 };
  const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, mode: 'rest', lastX: 0, lastZ: 0, shotT: 0, dirX: 0, dirZ: 1, treeHit: new Set() };
  let aim = null;
  let time = 0, introT = 0, introDur = 3, sinkT = 0, penaltyT = 0, penaltyReason = '';
  let restartArmed = 0, tipTimer = 0;
  let lastSurface = '';
  const cam = { pos: new THREE.Vector3(0, 10, -10), look: new THREE.Vector3(0, 0, 10) };
  const want = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
  const introFrom = { pos: new THREE.Vector3(), look: new THREE.Vector3() };

  function loadHole(i, withIntro) {
    game.holeIndex = i;
    prepareHole(HOLES[i], i);
    buildHoleScene();
    ball.x = cur.tx; ball.z = cur.tz; ball.y = heightAt(ball.x, ball.z) + BALL_R;
    ball.vx = ball.vy = ball.vz = 0; ball.mode = 'rest';
    ball.lastX = ball.x; ball.lastZ = ball.z;
    ballMesh.visible = true; ballMesh.scale.set(1, 1, 1);
    game.strokes = 0;
    aim = null; hideAim();
    autoClub();
    aimPose(want);
    if (withIntro && !reduceMotion) {
      game.state = 'intro'; introT = 0;
      introDur = 2.6 + Math.hypot(cur.hx - cur.tx, cur.hz - cur.tz) / 300;
      const fx = cur.hx - cur.tx, fz = cur.hz - cur.tz, fl = Math.hypot(fx, fz) || 1;
      introFrom.pos.set(cur.hx + (fx / fl) * 34, cur.greenLevel + 30, cur.hz + (fz / fl) * 34);
      introFrom.look.set(cur.hx, cur.greenLevel, cur.hz);
      cam.pos.copy(introFrom.pos); cam.look.copy(introFrom.look);
      skipEl.hidden = false;
    } else {
      game.state = 'idle';
      cam.pos.copy(want.pos); cam.look.copy(want.look);
      skipEl.hidden = true;
    }
    updateHud();
    const len = Math.round(Math.hypot(cur.hx - cur.tx, cur.hz - cur.tz));
    setTip(`<strong>${i + 1} · ${cur.def.name}</strong> · Par ${cur.def.par} · ${len} m · ${cur.def.hint}`);
  }

  // ---------- hud ----------
  function fmtPar(diff) {
    if (diff === 0) return 'E';
    return diff > 0 ? `+${diff}` : `−${-diff}`;
  }
  function completedDiff() {
    let d = 0;
    for (let i = 0; i < game.scores.length; i++) if (game.scores[i] != null) d += game.scores[i] - HOLES[i].par;
    return d;
  }
  function updateHud() {
    const par = cur.def.par;
    hud.hole.textContent = String(game.holeIndex + 1);
    hud.par.textContent = `of ${HOLES.length} · Par ${par}`;
    hud.strokes.textContent = String(game.strokes);
    hud.strokesSub.textContent = game.strokes === 0 ? 'this hole' : (game.strokes <= par ? `par is ${par}` : `${game.strokes - par} over`);
    hud.score.textContent = fmtPar(completedDiff());
    const done = game.scores.filter((s) => s != null).length;
    hud.scoreSub.textContent = `${done} hole${done === 1 ? '' : 's'} done`;
  }
  function updatePin() {
    const d = Math.round(Math.hypot(cur.hx - ball.x, cur.hz - ball.z));
    pinDist.innerHTML = `${d}<small>m</small>`;
    const s = ball.mode === 'rest' && Math.hypot(ball.x - cur.tx, ball.z - cur.tz) < 7 ? 'tee' : surfaceAt(ball.x, ball.z);
    if (s !== lastSurface) {
      lastSurface = s;
      const P = s === 'tee' ? { label: 'Tee', cls: '' } : SURF[s];
      pinSurface.textContent = P.label;
      pinSurface.className = 'pin-surface ' + P.cls;
    }
  }
  function setTip(html) { tip.innerHTML = html; }
  function toast(html, ms) {
    const prev = tip.innerHTML;
    tip.innerHTML = html;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => { tip.innerHTML = prev; }, ms);
  }

  // clubs
  const clubBtns = CLUBS.map((c, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'club'; b.id = 'club-' + c.id;
    b.setAttribute('aria-pressed', 'false');
    b.innerHTML = `<span class="club-name">${c.name}</span><span class="club-desc">${c.desc}</span>`;
    b.addEventListener('click', () => { initAudio(); if (game.state === 'idle' || game.state === 'intro') setClub(i); });
    clubsEl.appendChild(b);
    return b;
  });
  function setClub(i) {
    game.club = i;
    clubBtns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
    if (game.state === 'idle') aimPose(want);
  }
  function autoClub() {
    const d = Math.hypot(cur.hx - ball.x, cur.hz - ball.z);
    const s = surfaceAt(ball.x, ball.z);
    let i;
    if (s === 'green') i = 3;
    else if (d > 200) i = 0;
    else if (d > 95) i = 1;
    else i = 2;
    setClub(i);
  }

  // ---------- audio and haptics ----------
  let ac = null;
  function initAudio() {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function tone(freq, dur, type, vol, freqEnd) {
    if (!ac || game.muted) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain();
      const t0 = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is optional */ }
  }
  function noise(dur, vol, cutoff, cutoffEnd) {
    if (!ac || game.muted) return;
    try {
      const n = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, n, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, ac.currentTime);
      if (cutoffEnd) f.frequency.exponentialRampToValueAtTime(cutoffEnd, ac.currentTime + dur);
      const g = ac.createGain(); g.gain.value = vol;
      src.connect(f).connect(g).connect(ac.destination);
      src.start();
    } catch (e) { /* audio is optional */ }
  }
  const sfx = {
    swing(p) { noise(0.22, 0.2 + 0.3 * p, 600, 4000); tone(190, 0.07, 'triangle', 0.15 + 0.15 * p, 70); },
    putt(p) { noise(0.03, 0.12, 2500); tone(720, 0.05, 'square', 0.05 + 0.05 * p, 400); },
    land(p) { tone(95, 0.13, 'sine', Math.min(0.3, 0.08 + 0.25 * p), 40); noise(0.06, Math.min(0.25, 0.05 + 0.2 * p), 350); },
    tree() { noise(0.25, 0.25, 3000, 800); },
    sink() { tone(784, 0.16, 'sine', 0.22); setTimeout(() => tone(1175, 0.4, 'sine', 0.22), 100); },
    water() { noise(0.4, 0.35, 500); tone(300, 0.3, 'sine', 0.1, 90); },
    oob() { tone(220, 0.25, 'sawtooth', 0.08, 110); },
  };
  function buzz(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* optional */ }
  }

  // ---------- input ----------
  function shotFromDrag() {
    const dxs = aim.cx - aim.sx, dys = aim.cy - aim.sy;
    const len = Math.hypot(dxs, dys);
    const p = clamp(len / MAX_DRAG, 0, 1);
    const f = camForward();
    const rx = -f.z, rz = f.x;
    // dragging back (down the screen) sends the ball forward; dragging left sends it right
    let dx = f.x * dys - rx * dxs, dz = f.z * dys - rz * dxs;
    const l = Math.hypot(dx, dz);
    if (l < 1e-6) { dx = f.x; dz = f.z; } else { dx /= l; dz /= l; }
    return { x: dx, z: dz, p, len };
  }
  const _f = new THREE.Vector3();
  function camForward() {
    camera.getWorldDirection(_f);
    _f.y = 0;
    if (_f.lengthSq() < 1e-6) _f.set(0, 0, 1);
    return _f.normalize();
  }
  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    if (game.state === 'intro') { endIntro(); return; }
    if (game.state !== 'idle') return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    aim = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY };
    game.state = 'aiming';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!aim || e.pointerId !== aim.id) return;
    aim.cx = e.clientX; aim.cy = e.clientY;
  });
  function endAim(e, cancel) {
    if (!aim || e.pointerId !== aim.id) return;
    const s = shotFromDrag();
    aim = null; hideAim();
    if (cancel || s.len < MIN_DRAG) { game.state = 'idle'; return; }
    shoot(s.x, s.z, Math.max(0.08, s.p));
  }
  canvas.addEventListener('pointerup', (e) => endAim(e, false));
  canvas.addEventListener('pointercancel', (e) => endAim(e, true));
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (aim) e.preventDefault(); }, { passive: false });

  function launchVelocity(dx, dz, p, out) {
    const club = CLUBS[game.club];
    let speed = club.speed * p;
    const s = surfaceAt(ball.x, ball.z);
    if (club.id !== 'putter') { if (s === 'sand') speed *= 0.7; else if (s === 'rough') speed *= 0.86; }
    const loft = club.loft * Math.PI / 180;
    out.vx = dx * Math.cos(loft) * speed; out.vz = dz * Math.cos(loft) * speed; out.vy = Math.sin(loft) * speed;
    out.mode = club.id === 'putter' ? 'roll' : 'fly';
    return out;
  }
  function shoot(dx, dz, p) {
    launchVelocity(dx, dz, p, ball);
    ball.lastX = ball.x; ball.lastZ = ball.z;
    ball.treeHit = new Set(); ball.shotT = 0;
    ball.dirX = dx; ball.dirZ = dz;
    game.strokes++; game.shots++;
    game.state = 'shot';
    updateHud();
    if (ball.mode === 'roll') sfx.putt(p); else sfx.swing(p);
    buzz(12);
    clubBtns.forEach((b) => { b.disabled = true; });
  }

  function endIntro() {
    game.state = 'idle';
    skipEl.hidden = true;
    aimPose(want);
  }

  btnSound.addEventListener('click', () => {
    initAudio();
    game.muted = !game.muted;
    applyMuteUi();
    try { localStorage.setItem('pocketGolf.muted', game.muted ? '1' : '0'); } catch (e) { /* optional */ }
  });
  function applyMuteUi() {
    btnSound.setAttribute('aria-pressed', String(!game.muted));
    btnSound.setAttribute('aria-label', game.muted ? 'Sound off' : 'Sound on');
    btnSound.querySelectorAll('.wave').forEach((el) => { el.hidden = game.muted; });
    btnSound.querySelector('.mute').hidden = !game.muted;
  }
  btnRestart.addEventListener('click', () => {
    if (game.state === 'holeDone' || game.state === 'courseDone') return;
    if (game.strokes === 0 && (game.state === 'idle' || game.state === 'intro')) return;
    if (!restartArmed) {
      restartArmed = setTimeout(() => { restartArmed = 0; btnRestart.classList.remove('armed'); btnRestart.textContent = ''; btnRestart.appendChild(restartIcon); }, 2200);
      btnRestart.classList.add('armed');
      btnRestart.textContent = 'Sure?';
      return;
    }
    clearTimeout(restartArmed); restartArmed = 0;
    btnRestart.classList.remove('armed');
    btnRestart.textContent = ''; btnRestart.appendChild(restartIcon);
    clubBtns.forEach((b) => { b.disabled = false; });
    loadHole(game.holeIndex, false);
    toast('<strong>Hole restarted</strong>', 1500);
  });

  // ---------- physics ----------
  function treeCheck(b, trunkOnly) {
    for (const t of cur.trees) {
      const dx = b.x - t.x, dz = b.z - t.z;
      const d2 = dx * dx + dz * dz;
      const reach = t.canopyR + BALL_R;
      if (d2 > reach * reach) continue;
      const d = Math.sqrt(d2) || 0.001;
      const relY = b.y - t.y;
      if (relY < t.trunkH && d < t.trunkR + BALL_R) {
        const nx = dx / d, nz = dz / d;
        const vn = b.vx * nx + b.vz * nz;
        if (vn < 0) {
          b.vx -= 1.5 * vn * nx; b.vz -= 1.5 * vn * nz;
          b.x = t.x + nx * (t.trunkR + BALL_R); b.z = t.z + nz * (t.trunkR + BALL_R);
          if (b === ball) { sfx.tree(); buzz(10); }
        }
      } else if (!trunkOnly && relY >= t.canopyBottom && relY < t.top) {
        const rAt = t.canopyR * (1 - (relY - t.canopyBottom) / (t.top - t.canopyBottom)) + BALL_R;
        if (d < rAt && !b.treeHit.has(t)) {
          b.treeHit.add(t);
          b.vx *= 0.1; b.vz *= 0.1; b.vy = Math.min(b.vy, 0) * 0.2;
          if (b === ball) { sfx.tree(); buzz(15); toast('<strong>Trees!</strong> The ball dropped straight down', 1800); }
        }
      }
    }
  }

  // One physics step for body b (the ball, or a ghost for the preview). Returns an event string or null.
  function stepBody(b, h, live) {
    if (b.mode === 'fly') {
      b.vy -= G * h;
      b.x += b.vx * h; b.y += b.vy * h; b.z += b.vz * h;
      treeCheck(b, false);
      const g = heightAt(b.x, b.z);
      if (b.y - BALL_R <= g) {
        b.y = g + BALL_R;
        const n = normalAt(b.x, b.z);
        const s = surfaceAt(b.x, b.z); const P = SURF[s];
        const vn = b.vx * n.x + b.vy * n.y + b.vz * n.z;
        if (vn < 0) {
          const keep = 1 - P.fr;
          const tx = b.vx - vn * n.x, ty = b.vy - vn * n.y, tz = b.vz - vn * n.z;
          b.vx = tx * keep - vn * n.x * P.e; b.vy = ty * keep - vn * n.y * P.e; b.vz = tz * keep - vn * n.z * P.e;
          if (live) { const p = Math.min(1, -vn / 30); sfx.land(p); if (p > 0.2) buzz(8); }
          const nvn = b.vx * n.x + b.vy * n.y + b.vz * n.z;
          if (nvn < 1.3) { b.mode = 'roll'; }
          return 'land';
        }
      }
    } else if (b.mode === 'roll') {
      const n = normalAt(b.x, b.z);
      b.vx += G * n.y * n.x * h; b.vy += (-G + G * n.y * n.y) * h; b.vz += G * n.y * n.z * h;
      const vn = b.vx * n.x + b.vy * n.y + b.vz * n.z;
      b.vx -= vn * n.x; b.vy -= vn * n.y; b.vz -= vn * n.z;
      const s = surfaceAt(b.x, b.z); const P = SURF[s];
      const hx = cur.hx - b.x, hz = cur.hz - b.z;
      const hd = Math.hypot(hx, hz);
      let sp = Math.hypot(b.vx, b.vz);
      if (hd < HOLE_R * 2.5 && sp < 4.5 && hd > 0.01) { b.vx += (hx / hd) * 5 * h; b.vz += (hz / hd) * 5 * h; }
      sp = Math.hypot(b.vx, b.vy, b.vz);
      if (sp > 0) {
        const ns = Math.max(0, sp - P.mu * G * h);
        b.vx *= ns / sp; b.vy *= ns / sp; b.vz *= ns / sp;
      }
      b.x += b.vx * h; b.z += b.vz * h;
      b.y = heightAt(b.x, b.z) + BALL_R;
      treeCheck(b, true);
      const sp2 = Math.hypot(b.vx, b.vz);
      if (hd < HOLE_R && sp2 < 3.2) return 'sink';
      if (sp2 < 0.12) { b.vx = b.vy = b.vz = 0; b.mode = 'rest'; return 'stop'; }
    }
    if (b.y < 0.3 && heightAt(b.x, b.z) < 0) return 'water';
    const bb = cur.bounds;
    if (b.x < bb.minX || b.x > bb.maxX || b.z < bb.minZ || b.z > bb.maxZ) return 'oob';
    return null;
  }

  function update(dt) {
    time += dt;
    if (game.state === 'intro') {
      introT += dt;
      const t = clamp(introT / introDur, 0, 1);
      const k = t * t * (3 - 2 * t);
      aimPose(want);
      cam.pos.lerpVectors(introFrom.pos, want.pos, k);
      cam.look.lerpVectors(introFrom.look, want.look, k);
      if (introT >= introDur + 0.25) endIntro();
      return;
    }
    if (game.state === 'sinking') {
      sinkT += dt;
      const k = Math.min(1, sinkT / 0.4);
      ball.x += (cur.hx - ball.x) * Math.min(1, dt * 12);
      ball.z += (cur.hz - ball.z) * Math.min(1, dt * 12);
      ball.y = heightAt(cur.hx, cur.hz) + BALL_R - k * 1.6;
      if (k >= 1) { ballMesh.visible = false; finishHole(false); }
      return;
    }
    if (game.state === 'penalty') {
      penaltyT += dt;
      if (penaltyT >= 1.1) {
        ball.x = ball.lastX; ball.z = ball.lastZ; ball.y = heightAt(ball.x, ball.z) + BALL_R;
        ball.vx = ball.vy = ball.vz = 0; ball.mode = 'rest';
        ballMesh.visible = true;
        game.strokes++;
        updateHud();
        settle();
      }
      return;
    }
    if (game.state !== 'shot') return;

    let remaining = dt * TIME_SCALE;
    const sub = 1 / 240;
    ball.shotT += remaining;
    while (remaining > 0) {
      const h = Math.min(sub, remaining); remaining -= h;
      const ev = stepBody(ball, h, true);
      if (ev === 'sink') {
        game.state = 'sinking'; sinkT = 0;
        ball.vx = ball.vy = ball.vz = 0;
        sfx.sink(); buzz([20, 40, 60]);
        return;
      }
      if (ev === 'stop' || ball.shotT > 30) {
        ball.vx = ball.vy = ball.vz = 0; ball.mode = 'rest';
        settle();
        return;
      }
      if (ev === 'water' || ev === 'oob') {
        game.state = 'penalty'; penaltyT = 0; penaltyReason = ev;
        ball.vx = ball.vy = ball.vz = 0;
        if (ev === 'water') { ballMesh.visible = false; sfx.water(); buzz([10, 30, 10]); toast('<strong>Splash!</strong> One stroke penalty, play it again from there', 2600); }
        else { sfx.oob(); buzz([10, 30, 10]); toast('<strong>Out of bounds.</strong> One stroke penalty, play it again from there', 2600); }
        return;
      }
    }
  }

  // ball has come to rest: pick a club, point the camera, or end the hole
  function settle() {
    if (game.strokes >= cur.def.par + MAX_OVER_PAR) { finishHole(true); return; }
    game.state = 'idle';
    clubBtns.forEach((b) => { b.disabled = false; });
    autoClub();
    aimPose(want);
  }

  // ---------- camera ----------
  function aimPose(out) {
    const club = CLUBS[game.club];
    const dx = cur.hx - ball.x, dz = cur.hz - ball.z;
    const d = Math.hypot(dx, dz) || 1;
    const fx = dx / d, fz = dz / d;
    const putter = club.id === 'putter';
    const back = putter ? 4.6 : 7.6, up = putter ? 2.4 : 3.8;
    out.pos.set(ball.x - fx * back, ball.y + up, ball.z - fz * back);
    const floor = heightAt(out.pos.x, out.pos.z) + 1.3;
    if (out.pos.y < floor) out.pos.y = floor;
    out.look.set(ball.x + fx * 10, ball.y + 0.4, ball.z + fz * 10);
  }
  function chasePose(out) {
    const sp = Math.hypot(ball.vx, ball.vz);
    let dx = ball.dirX, dz = ball.dirZ;
    if (sp > 1.5) { dx = ball.vx / sp; dz = ball.vz / sp; ball.dirX = dx; ball.dirZ = dz; }
    const ground = heightAt(ball.x, ball.z);
    const relH = Math.max(0, ball.y - ground);
    out.pos.set(ball.x - dx * 11, ball.y + 4 + relH * 0.25, ball.z - dz * 11);
    const floor = heightAt(out.pos.x, out.pos.z) + 1.5;
    if (out.pos.y < floor) out.pos.y = floor;
    out.look.set(ball.x, ball.y + 0.5, ball.z);
  }
  function updateCamera(dt) {
    if (game.state === 'intro') { /* set in update */ }
    else if (game.state === 'shot' || game.state === 'sinking' || game.state === 'penalty') {
      if (game.state === 'shot') chasePose(want);
      const k = 1 - Math.exp(-dt * 6);
      cam.pos.lerp(want.pos, k); cam.look.lerp(want.look, k);
    } else {
      const k = 1 - Math.exp(-dt * 4.5);
      cam.pos.lerp(want.pos, k); cam.look.lerp(want.look, k);
    }
    camera.position.copy(cam.pos);
    camera.lookAt(cam.look);
  }

  // ---------- aim preview ----------
  const ghost = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, mode: 'fly', treeHit: new Set() };
  function powerColor(p) {
    const c1 = new THREE.Color(PAL.lime), c2 = new THREE.Color(PAL.amber), c3 = new THREE.Color(PAL.red);
    return p < 0.5 ? c1.lerp(c2, p * 2) : c2.lerp(c3, (p - 0.5) * 2);
  }
  function hideAim() {
    dots.visible = false; landRing.visible = false;
    powerEl.classList.remove('on'); carryEl.classList.remove('on');
  }
  function drawAim() {
    const s = shotFromDrag();
    if (s.len < MIN_DRAG) { hideAim(); return; }
    const p = Math.max(0.08, s.p);
    ghost.x = ball.x; ghost.y = ball.y; ghost.z = ball.z;
    ghost.treeHit = new Set();
    launchVelocity(s.x, s.z, p, ghost);
    const arr = dotGeo.attributes.position.array;
    let n = 0, t = 0;
    const h = 1 / 60;
    const every = ghost.mode === 'fly' ? 3 : 5;
    let steps = 0, ended = false;
    while (t < 12 && n < MAX_DOTS && !ended) {
      const ev = stepBody(ghost, h, false);
      t += h; steps++;
      if (steps % every === 0) { arr[n * 3] = ghost.x; arr[n * 3 + 1] = ghost.y + 0.15; arr[n * 3 + 2] = ghost.z; n++; }
      if (ev === 'land' || ev === 'stop' || ev === 'sink' || ev === 'water' || ev === 'oob') ended = true;
      if (ghost.mode === 'roll' && ghost.mode !== 'fly' && CLUBS[game.club].id !== 'putter') ended = true;
    }
    dotGeo.attributes.position.needsUpdate = true;
    dotGeo.setDrawRange(0, n);
    const col = powerColor(p);
    dotMat.color.copy(col);
    dots.visible = n > 0;
    landRing.visible = true;
    landRing.position.set(ghost.x, heightAt(ghost.x, ghost.z) + 0.1, ghost.z);
    landRing.material.color.copy(col);
    powerEl.classList.add('on'); carryEl.classList.add('on');
    powerFill.style.height = `${Math.round(p * 100)}%`;
    powerFill.style.background = '#' + col.getHexString();
    const carry = Math.round(Math.hypot(ghost.x - ball.x, ghost.z - ball.z));
    carryEl.innerHTML = `${carry}<small> m ${ghost.mode === 'fly' ? 'carry' : 'roll'}</small>`;
  }

  // ---------- scoring ----------
  function scoreLabel(strokes, par) {
    const d = strokes - par;
    if (strokes === 1) return 'Hole in one!';
    if (d <= -3) return 'Albatross!';
    if (d === -2) return 'Eagle!';
    if (d === -1) return 'Birdie!';
    if (d === 0) return 'Par';
    if (d === 1) return 'Bogey';
    if (d === 2) return 'Double bogey';
    if (d === 3) return 'Triple bogey';
    return `${d} over`;
  }
  function markClass(strokes, par) {
    const d = strokes - par;
    if (d <= -2) return 'mark eagle';
    if (d === -1) return 'mark birdie';
    if (d === 1) return 'mark bogey';
    if (d >= 2) return 'mark double';
    return 'mark';
  }
  function showOverlay(o) {
    ov.eyebrow.textContent = o.eyebrow;
    ov.title.textContent = o.title;
    ov.title.classList.toggle('gold', !!o.gold);
    ov.sub.textContent = o.sub;
    ov.body.innerHTML = o.body || '';
    ov.btn.textContent = o.button;
    ov.btn.onclick = () => { initAudio(); overlay.hidden = true; o.onClick(); };
    overlay.hidden = false;
    ov.btn.focus({ preventScroll: true });
  }
  function finishHole(pickedUp) {
    game.scores[game.holeIndex] = game.strokes;
    game.state = 'holeDone';
    updateHud();
    const par = cur.def.par;
    const last = game.holeIndex === HOLES.length - 1;
    const d = game.strokes - par;
    setTimeout(() => {
      showOverlay({
        eyebrow: `Hole ${game.holeIndex + 1} · ${cur.def.name} · Par ${par}`,
        title: pickedUp ? 'Picked up' : scoreLabel(game.strokes, par),
        gold: !pickedUp && d < 0,
        sub: pickedUp
          ? `Max ${game.strokes} strokes on this hole`
          : `${game.strokes} stroke${game.strokes === 1 ? '' : 's'}, ${d === 0 ? 'level par' : fmtPar(d) + ' on this hole'}`,
        button: last ? 'See the scorecard' : 'Next hole',
        onClick: () => { clubBtns.forEach((b) => { b.disabled = false; }); if (last) finishCourse(); else loadHole(game.holeIndex + 1, true); },
      });
    }, pickedUp ? 250 : 500);
  }
  function finishCourse() {
    game.state = 'courseDone';
    const total = game.scores.reduce((s, v) => s + v, 0);
    const d = total - TOTAL_PAR;
    let best = null;
    try {
      const prev = parseInt(localStorage.getItem('pocketGolf.best'), 10);
      best = Number.isFinite(prev) ? prev : null;
      if (best === null || total < best) localStorage.setItem('pocketGolf.best', String(total));
    } catch (e) { /* storage is optional */ }
    const isNewBest = best === null || total < best;
    const cells = (fn) => HOLES.map((h, i) => `<td>${fn(h, i)}</td>`).join('');
    const body = `
      <table class="scorecard" aria-label="Scorecard">
        <tr><th>Hole</th>${cells((h, i) => i + 1)}<td>Tot</td></tr>
        <tr><th>Par</th>${cells((h) => h.par)}<td>${TOTAL_PAR}</td></tr>
        <tr><th>You</th>${cells((h, i) => `<span class="${markClass(game.scores[i], h.par)}">${game.scores[i]}</span>`)}<td>${total}</td></tr>
      </table>
      <p class="legend">Circle for birdie, double circle for eagle, square for bogey, double square for worse.</p>
      <p class="best">${isNewBest ? '<strong>New best round</strong>' : `Your best round is <strong>${best}</strong>`}</p>`;
    showOverlay({
      eyebrow: 'Round complete · 9 holes',
      title: d === 0 ? 'Level par' : (d < 0 ? `${-d} under par` : `${d} over par`),
      gold: d < 0,
      sub: `${total} strokes, par ${TOTAL_PAR}`,
      body,
      button: 'Play again',
      onClick: () => { game.scores = []; game.shots = 0; loadHole(0, true); },
    });
  }

  // ---------- render loop ----------
  function resize() {
    const r = stage.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    updateCamera(dt);
    if (game.state === 'aiming' && aim) drawAim();

    ballMesh.position.set(ball.x, ball.y, ball.z);
    const ground = heightAt(ball.x, ball.z);
    const relH = Math.max(0, ball.y - BALL_R - ground);
    shadowMesh.visible = ballMesh.visible;
    shadowMesh.position.set(ball.x, ground + 0.06, ball.z);
    const sh = 1 / (1 + relH * 0.06);
    shadowMesh.scale.set(sh, sh, 1);
    shadowMesh.material.opacity = Math.max(0.08, 0.35 - relH * 0.008);
    if (flagMesh) {
      flagMesh.rotation.y = reduceMotion ? 0 : Math.sin(time * 3.2) * 0.12;
      const dist = Math.hypot(cur.hx - ball.x, cur.hz - ball.z);
      beaconMat.opacity = clamp((dist - 22) / 70, 0, 0.3);
    }
    updatePin();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  function start(saved) {
    try { game.muted = localStorage.getItem('pocketGolf.muted') === '1'; } catch (e) { /* optional */ }
    applyMuteUi();
    if (saved && Array.isArray(saved.scores) && Number.isInteger(saved.holeIndex) && saved.holeIndex < HOLES.length) {
      game.scores = saved.scores.slice(0, saved.holeIndex);
      game.shots = saved.shots || 0;
      loadHole(saved.holeIndex, true);
    } else {
      loadHole(0, true);
    }
    requestAnimationFrame(frame);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ holeIndex: game.holeIndex, scores: game.scores, shots: game.shots }));
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : null);
})();
</script>
</body>
</html>
